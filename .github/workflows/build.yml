                  var tT = bestLag.toDouble()
                  if (bestLag in (lo + 1) until hi) {
                      val a = ac[bestLag - 1]; val b = ac[bestLag]; val c = ac[bestLag + 1]
                      val d = a - 2 * b + c
                      if (d != 0.0) tT += (0.5 * (a - c) / d).coerceIn(-0.5, 0.5)
