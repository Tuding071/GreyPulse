          fun EqPanel(vm: PlayerVm, askDelete: (Int) -> Unit) {
              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier.fillMaxWidth().padding(start = 4.dp, end = 4.dp, top = 6.dp, bottom = 14.dp),
                      verticalAlignment = Alignment.CenterVertically
