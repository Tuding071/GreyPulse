          // ---------------------------------------------------------------- data
          data class Track(val id: Long, val title: String, val artist: String, val durMs: Long, val uri: Uri)

          enum class Panel { None, List, Menu, Eq, Viz }

          fun scanTracks(ctx: Context): List<Track> {
              val list = ArrayList<Track>()
              try {
                  val uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val proj = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.TITLE,
                      MediaStore.Audio.Media.ARTIST,
                      MediaStore.Audio.Media.DURATION
                  )
                  val sel = MediaStore.Audio.Media.IS_RINGTONE + "=0 AND " +
                      MediaStore.Audio.Media.IS_NOTIFICATION + "=0 AND " +
                      MediaStore.Audio.Media.IS_ALARM + "=0 AND " +
                      MediaStore.Audio.Media.DURATION + ">=5000"
                  ctx.contentResolver.query(uri, proj, sel, null, MediaStore.Audio.Media.TITLE + " COLLATE NOCASE ASC")?.use { c ->
                      while (c.moveToNext()) {
                          val id = c.getLong(0)
                          val title = c.getString(1) ?: "Unknown"
                          var artist = c.getString(2) ?: ""
                          if (artist == MediaStore.UNKNOWN_STRING || artist.isBlank()) artist = "Unknown artist"
                          val dur = c.getLong(3)
                          list.add(Track(id, title, artist, dur, android.content.ContentUris.withAppendedId(uri, id)))
                      }
                  }
              } catch (e: Exception) {
              }
              return list
          }

          fun fmtMs(ms: Long): String {
              val s = (ms.coerceAtLeast(0L) / 1000f).roundToInt()
              return (s / 60).toString() + ":" + (s % 60).toString().padStart(2, '0')
          }

          // ---------------------------------------------------------------- state holder
          class PlayerVm(val app: Context, val scope: CoroutineScope) {
              var tracks by mutableStateOf(listOf<Track>())
              var nowId by mutableStateOf("")
              var title by mutableStateOf("GreyPulse")
              var artist by mutableStateOf("Menu > Scan Files to find songs")
              var isPlaying by mutableStateOf(false)
              var hasQueue by mutableStateOf(false)
              var posMs by mutableLongStateOf(0L)
              var durMs by mutableLongStateOf(0L)
              var eqOn by mutableStateOf(false)
              var eqBands by mutableStateOf(listOf<EqBand>())
              var controller: MediaController? = null

              private val prefs = app.getSharedPreferences("pulse", Context.MODE_PRIVATE)

              private val listener = object : Player.Listener {
                  override fun onEvents(player: Player, events: Player.Events) {
                      sync()
                  }
              }

              init {
                  loadEq()
                  Cfg.load(prefs)
              }

              fun saveCfg() {
                  Cfg.rangeVersion++
                  Cfg.save(prefs)
              }

              fun resetCfg() {
                  Cfg.reset()
                  saveCfg()
              }

              fun attach(c: MediaController) {
                  controller = c
                  c.addListener(listener)
                  sync()
              }

              fun detach() {
                  controller?.removeListener(listener)
                  controller = null
              }

              fun sync() {
                  val c = controller ?: return
                  val mi = c.currentMediaItem
                  hasQueue = c.mediaItemCount > 0
                  nowId = mi?.mediaId ?: ""
                  if (mi != null) {
                      title = mi.mediaMetadata.title?.toString() ?: "Unknown"
                      artist = mi.mediaMetadata.artist?.toString() ?: ""
                  }
                  isPlaying = c.isPlaying
                  val d = c.duration
                  durMs = if (d != C.TIME_UNSET && d > 0) d else (mi?.mediaMetadata?.durationMs ?: 0L)
                  posMs = c.currentPosition
                  if (nowId != lastEnq) {
                      lastEnq = nowId
                      nowId.toLongOrNull()?.let { enqueue(it, true) }
                  }
              }

              fun pollPos() {
                  val c = controller ?: return
                  posMs = c.currentPosition
              }

              private fun items(): List<MediaItem> = tracks.map {
                  MediaItem.Builder()
                      .setMediaId(it.id.toString())
                      .setUri(it.uri)
                      .setMediaMetadata(
                          MediaMetadata.Builder()
                              .setTitle(it.title)
                              .setArtist(it.artist)
                              .setDurationMs(it.durMs)
                              .build()
                      )
                      .build()
              }

              private fun queueMatches(c: MediaController): Boolean {
                  if (tracks.isEmpty() || c.mediaItemCount != tracks.size) return false
                  return c.getMediaItemAt(0).mediaId == tracks[0].id.toString() &&
                      c.getMediaItemAt(c.mediaItemCount - 1).mediaId == tracks.last().id.toString()
              }

              fun playIndex(i: Int) {
                  val c = controller ?: return
                  if (tracks.isEmpty() || i !in tracks.indices) return
                  if (queueMatches(c)) {
                      c.seekTo(i, 0L)
                  } else {
                      c.setMediaItems(items(), i, 0L)
                  }
                  c.prepare()
                  c.play()
              }

              fun togglePlay() {
                  val c = controller ?: return
                  if (!hasQueue) {
                      if (tracks.isNotEmpty()) playIndex(0)
                      return
                  }
                  if (c.isPlaying) {
                      c.pause()
                  } else {
                      if (c.playbackState == Player.STATE_IDLE) c.prepare()
                      c.play()
                  }
              }

              fun next() {
                  val c = controller ?: return
                  if (!hasQueue) { if (tracks.isNotEmpty()) playIndex(0); return }
                  c.seekToNextMediaItem()
                  c.play()
              }

              fun prev() {
                  val c = controller ?: return
                  if (!hasQueue) { if (tracks.isNotEmpty()) playIndex(0); return }
                  c.seekToPreviousMediaItem()
                  c.play()
              }

              fun seekFrac(f: Float) {
                  val c = controller ?: return
                  if (durMs <= 0) return
                  val p = (f * durMs).toLong()
                  c.seekTo(p)
                  posMs = p
              }

              fun hasAudioPerm(): Boolean {
                  val p = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO
                  else Manifest.permission.READ_EXTERNAL_STORAGE
                  return ContextCompat.checkSelfPermission(app, p) == PackageManager.PERMISSION_GRANTED
              }

              fun scan(manual: Boolean) {
                  if (!hasAudioPerm()) {
                      if (manual) Toast.makeText(app, "Allow audio permission to find songs", Toast.LENGTH_SHORT).show()
                      return
                  }
                  scope.launch {
                      val r = withContext(Dispatchers.IO) { scanTracks(app) }
                      tracks = r
                      if (manual) Toast.makeText(app, "Found " + r.size + " songs", Toast.LENGTH_SHORT).show()
                  }
              }

              // ---- stem analysis: once per song, result saved in app storage
              private val maps = ConcurrentHashMap<Long, SongMap>()
              private val checked = ConcurrentHashMap.newKeySet<Long>()
              private val skipped = ConcurrentHashMap.newKeySet<Long>()
              private val queue = ConcurrentLinkedDeque<Long>()
              private var worker: Job? = null
              private var analyzer: Analyzer? = null
              private var lastEnq = ""
              var anaActive by mutableStateOf(false)
              var anaTitle by mutableStateOf("")
              var anaProgress by mutableStateOf(0f)
              var anaQueued by mutableStateOf(0)

              private fun mapFile(id: Long) = File(app.filesDir, "maps/" + id + ".gpm")

              fun mapFor(idStr: String): SongMap? {
                  val id = idStr.toLongOrNull() ?: return null
                  maps[id]?.let { return it }
                  if (!checked.add(id)) return null
                  val m = SongMap.load(mapFile(id))
                  if (m != null) maps[id] = m
                  return m
              }

              private fun hasMap(id: Long) = maps.containsKey(id) || mapFile(id).exists()

              fun enqueue(id: Long, front: Boolean) {
                  if (id in skipped || queue.contains(id) || hasMap(id)) return
                  if (front) queue.addFirst(id) else queue.addLast(id)
                  anaQueued = queue.size
                  startWorker()
              }

              fun analyzeAll() {
                  skipped.clear()
                  for (t in tracks) enqueue(t.id, false)
                  if (queue.isEmpty() && !anaActive) Toast.makeText(app, "All songs are already analyzed", Toast.LENGTH_SHORT).show()
              }

              fun skipCurrent() { analyzer?.cancel = true }

              fun stopAll() {
                  queue.clear()
                  anaQueued = 0
                  analyzer?.cancel = true
              }

              private fun startWorker() {
                  if (worker?.isActive == true) return
                  worker = scope.launch(Dispatchers.Default) {
                      val an = Analyzer(app)
                      analyzer = an
                      try {
                          while (true) {
                              val id = queue.pollFirst() ?: break
                              anaQueued = queue.size
                              val tr = tracks.firstOrNull { it.id == id } ?: continue
                              if (hasMap(id)) continue
                              anaTitle = tr.title
                              anaProgress = 0f
                              anaActive = true
                              val m = an.analyze(tr.uri) { anaProgress = it }
                              if (m != null) {
                                  SongMap.save(m, mapFile(id))
                                  maps[id] = m
                              } else {
                                  skipped.add(id)
                                  if (!an.cancel && an.lastError.isNotEmpty()) {
                                      val msg = an.lastError
                                      queue.clear() // a model problem would repeat for every song
                                      withContext(Dispatchers.Main) {
                                          Toast.makeText(app, "Analysis failed: " + msg, Toast.LENGTH_LONG).show()
                                      }
                                  }
                              }
                          }
                      } finally {
                          an.close()
                          analyzer = null
                          anaActive = false
                          anaQueued = 0
                      }
                  }
              }

              // ---- equalizer persistence
              private fun loadEq() {
                  eqOn = prefs.getBoolean("on", false)
                  val s = prefs.getString("bands", "") ?: ""
                  eqBands = s.split(",").mapNotNull { p ->
                      val kv = p.split(":")
                      if (kv.size == 2) {
                          val f = kv[0].toIntOrNull()
                          val g = kv[1].toIntOrNull()
                          if (f != null && g != null) EqBand(f, g.coerceIn(-50, 0)) else null
                      } else null
                  }.sortedBy { it.freq }
                  AudioBus.setEq(eqOn, eqBands)
              }

              fun pushEq() {
                  AudioBus.setEq(eqOn, eqBands)
                  prefs.edit()
                      .putBoolean("on", eqOn)
                      .putString("bands", eqBands.joinToString(",") { it.freq.toString() + ":" + it.gain })
                      .apply()
              }
          }

          // ---------------------------------------------------------------- helpers
          fun Modifier.tap(onClick: () -> Unit): Modifier = composed {
              val src = remember { MutableInteractionSource() }
              val pressed by src.collectIsPressedAsState()
              this.alpha(if (pressed) 0.55f else 1f)
                  .clickable(interactionSource = src, indication = null, onClick = onClick)
          }

          @Composable
          fun Ico(dp: Dp, content: DrawScope.() -> Unit) {
              Canvas(Modifier.size(dp)) {
                  val s = this.size.width / 24f
                  scale(s, s, pivot = Offset.Zero) { content() }
              }
          }

          fun DrawScope.ln(c: Color, x1: Float, y1: Float, x2: Float, y2: Float, w: Float = 2.4f) {
              drawLine(c, Offset(x1, y1), Offset(x2, y2), w, StrokeCap.Round)
          }

          fun DrawScope.tri(c: Color, x1: Float, y1: Float, x2: Float, y2: Float, x3: Float, y3: Float) {
              val p = Path()
              p.moveTo(x1, y1); p.lineTo(x2, y2); p.lineTo(x3, y3); p.close()
              drawPath(p, c)
          }

