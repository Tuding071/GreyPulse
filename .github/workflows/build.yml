                  // ---- beat grid: dynamic programming (Ellis 2007)
                  var mean = 0.0
                  for (v in o) mean += v
                  mean /= n
                  var sd = 0.0
                  for (v in o) sd += (v - mean) * (v - mean)
                  sd = sqrt(sd / n) + 1e-12
                  val on = DoubleArray(n) { o[it] / sd }
                  val c = DoubleArray(n)
                  val prev = IntArray(n) { -1 }
                  for (i in 0 until n) {
                      val jlo = max(0, (i - 2 * tT).toInt())
                      val jhi = (i - tT / 2).toInt()
                      var bv = 0.0
                      var bj = -1
                      for (j in jlo..jhi) {
                          if (j < 0 || j >= i) continue
                          val v = c[j] - 100.0 * ln((i - j) / tT).pow(2)
                          if (bj < 0 || v > bv) { bv = v; bj = j }
                      }
                      if (bj >= 0 && bv > 0) { c[i] = on[i] + bv; prev[i] = bj } else c[i] = on[i]
