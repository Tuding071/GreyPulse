                          Text(
                              "No bands yet.\nType a frequency above and tap Add.",
                              color = CDim, fontSize = 12.sp, textAlign = TextAlign.Center, lineHeight = 18.sp,
                              modifier = Modifier.fillMaxWidth().padding(22.dp)
                          )
                      } else {
                          LazyColumn(Modifier.fillMaxSize()) {
                              itemsIndexed(vm.eqBands, key = { _, b -> b.freq }) { i, b ->
                                  BandRow(
                                      b = b,
                                      enabled = vm.eqOn,
                                      onGain = { g ->
                                          vm.eqBands = vm.eqBands.map { if (it.freq == b.freq) it.copy(gain = g) else it }
                                          vm.pushEq()
                                      },
                                      onDelete = { askDelete(i) }
                                  )
                              }
                          }
                      }
                  }
                  Text(
                      "ENTER A FREQUENCY ABOVE, THEN TAP ADD",
                      color = Color(0x55FFFFFF), fontSize = 10.sp, letterSpacing = 0.6.sp,
                      textAlign = TextAlign.Center,
                      modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp)
