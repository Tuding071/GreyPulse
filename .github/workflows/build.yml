name: Build GreyPulse

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-greypulse-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: gradle-greypulse-

      - name: Generate project structure
        run: |
          mkdir -p app/src/main/java/com/grey/pulse
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GreyPulse"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.0" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=36
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts << 'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          val buildNum = (System.getenv("BUILD_NUMBER") ?: "1").toInt()

          android {
              namespace = "com.grey.pulse"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.grey.pulse"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = buildNum
                  versionName = buildNum.toString()
              }

              signingConfigs {
                  create("dummy") {
                      storeFile = file("dummy.keystore")
                      storePassword = "password"
                      keyAlias = "dummy"
                      keyPassword = "password"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      isDebuggable = false
                      signingConfig = signingConfigs.getByName("dummy")
                  }
              }

              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a")
                      isUniversalApk = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2025.05.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.media3:media3-common:1.8.0")
              implementation("androidx.media3:media3-exoplayer:1.8.0")
              implementation("androidx.media3:media3-session:1.8.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="GreyPulse"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#FF0E0E10</item>
                  <item name="android:statusBarColor">#00000000</item>
                  <item name="android:navigationBarColor">#00000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">GreyPulse</string>
          </resources>
          EOF

          cat > app/src/main/java/com/grey/pulse/Audio.kt << 'KOTLIN_EOF'
          package com.grey.pulse

          import androidx.annotation.OptIn
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import androidx.media3.common.util.UnstableApi
          import java.nio.ByteBuffer
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.log10
          import kotlin.math.max
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.math.sqrt

          data class EqBand(val freq: Int, val gain: Int)

          /**
           * Shared in-process bridge between the audio thread (BusProcessor) and the UI.
           * levels[] = 12 bass bands from FREQ_MIN to FREQ_MAX Hz, each 0..1.
           */
          object AudioBus {
              // The visualizer only listens to this range (as requested: 16 Hz - 60 Hz).
              const val FREQ_MIN = 16
              const val FREQ_MAX = 60
              const val BANDS = 12 // 16,20,24,...,60 Hz (4 Hz steps)

              @JvmField val levels = FloatArray(BANDS)
              @Volatile var lastUpdateNs = 0L

              @Volatile var eqOn = false
              @Volatile var eqBands: List<EqBand> = emptyList()
              @Volatile var eqVersion = 0

              fun setEq(on: Boolean, bands: List<EqBand>) {
                  eqOn = on
                  eqBands = bands
                  eqVersion++
              }
          }

          /**
           * Sits in ExoPlayer's audio chain (16-bit PCM only):
           *  1) user EQ: one peaking biquad per band (gain -50..0 dB)
           *  2) bass analysis: low-pass + decimate, then Goertzel at 16..60 Hz -> AudioBus.levels
           * Analysis is done AFTER the EQ, so the visualizer shows what you actually hear.
           * No microphone / RECORD_AUDIO permission needed.
           */
          @OptIn(UnstableApi::class)
          class BusProcessor : BaseAudioProcessor() {

              companion object {
                  private const val N = 256          // Goertzel window (decimated samples)
                  private const val HOP = 32         // new analysis every 32 decimated samples
                  private const val EQ_Q = 1.0
                  private val FREQS = DoubleArray(AudioBus.BANDS) {
                      AudioBus.FREQ_MIN + it * (AudioBus.FREQ_MAX - AudioBus.FREQ_MIN) / (AudioBus.BANDS - 1.0)
                  }
                  private val WIN = FloatArray(N) { (0.5 - 0.5 * cos(2.0 * PI * it / (N - 1))).toFloat() }
              }

              private var sr = 44100
              private var ch = 2

              // EQ state (audio thread only)
              private var eqVersionApplied = -1
              private var eqWasOn = false
              private var nBands = 0
              private var coef = DoubleArray(0) // 5 per band: b0 b1 b2 a1 a2
              private var st = DoubleArray(0)   // 4 per band per channel: x1 x2 y1 y2

              // analysis state
              private var dec = 32
              private var decCount = 0
              private var lpA = 0.0
              private var lp1 = 0.0
              private var lp2 = 0.0
              private val ring = FloatArray(N)
              private var ringPos = 0
              private var hopCount = 0
              private val gk = DoubleArray(AudioBus.BANDS)

              override fun onConfigure(inputAudioFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputAudioFormat.encoding != C.ENCODING_PCM_16BIT ||
                      inputAudioFormat.channelCount < 1 || inputAudioFormat.channelCount > 8
                  ) {
                      // not supported: stay inactive, audio still plays normally
                      return AudioProcessor.AudioFormat.NOT_SET
                  }
                  sr = inputAudioFormat.sampleRate
                  ch = inputAudioFormat.channelCount
                  dec = max(1, sr / 1400)
                  val fsD = sr.toDouble() / dec
                  for (i in 0 until AudioBus.BANDS) gk[i] = 2.0 * cos(2.0 * PI * FREQS[i] / fsD)
                  lpA = 1.0 - Math.exp(-2.0 * PI * 200.0 / sr)
                  lp1 = 0.0; lp2 = 0.0; decCount = 0; hopCount = 0; ringPos = 0
                  java.util.Arrays.fill(ring, 0f)
                  eqVersionApplied = -1
                  nBands = 0
                  st = DoubleArray(0)
                  return inputAudioFormat
              }

              override fun queueInput(inputBuffer: ByteBuffer) {
                  val n = inputBuffer.remaining()
                  if (n == 0) return
                  val out = replaceOutputBuffer(n)
                  syncEq()
                  val on = AudioBus.eqOn && nBands > 0
                  if (on && !eqWasOn) java.util.Arrays.fill(st, 0.0)
                  eqWasOn = on
                  val frames = n / (2 * ch)
                  for (f in 0 until frames) {
                      var mono = 0.0
                      for (c in 0 until ch) {
                          var x = inputBuffer.getShort().toDouble() / 32768.0
                          if (on) {
                              for (b in 0 until nBands) {
                                  val ci = b * 5
                                  val si = (b * ch + c) * 4
                                  val y = coef[ci] * x + coef[ci + 1] * st[si] + coef[ci + 2] * st[si + 1] -
                                      coef[ci + 3] * st[si + 2] - coef[ci + 4] * st[si + 3]
                                  st[si + 1] = st[si]; st[si] = x
                                  st[si + 3] = st[si + 2]; st[si + 2] = y
                                  x = y
                              }
                          }
                          val v = Math.round(x * 32768.0).coerceIn(-32768L, 32767L).toInt()
                          out.putShort(v.toShort())
                          mono += x
                      }
                      analyze(mono / ch)
                  }
                  while (inputBuffer.hasRemaining()) out.put(inputBuffer.get())
                  out.flip()
              }

              private fun syncEq() {
                  val v = AudioBus.eqVersion
                  if (v == eqVersionApplied) return
                  eqVersionApplied = v
                  val bands = AudioBus.eqBands
                  val newN = bands.size
                  if (newN != nBands || st.size != newN * ch * 4) st = DoubleArray(newN * ch * 4)
                  nBands = newN
                  coef = DoubleArray(newN * 5)
                  for (i in bands.indices) {
                      val b = bands[i]
                      val ci = i * 5
                      if (b.gain >= 0 || b.freq >= sr * 0.45) {
                          coef[ci] = 1.0 // identity
                          continue
                      }
                      val a = 10.0.pow(b.gain / 40.0)
                      val w0 = 2.0 * PI * b.freq / sr
                      val alpha = sin(w0) / (2.0 * EQ_Q)
                      val cw = cos(w0)
                      val a0 = 1.0 + alpha / a
                      coef[ci] = (1.0 + alpha * a) / a0
                      coef[ci + 1] = (-2.0 * cw) / a0
                      coef[ci + 2] = (1.0 - alpha * a) / a0
                      coef[ci + 3] = (-2.0 * cw) / a0
                      coef[ci + 4] = (1.0 - alpha / a) / a0
                  }
              }

              private fun analyze(x: Double) {
                  lp1 += lpA * (x - lp1)
                  lp2 += lpA * (lp1 - lp2)
                  decCount++
                  if (decCount < dec) return
                  decCount = 0
                  ring[ringPos] = lp2.toFloat()
                  ringPos = (ringPos + 1) % N
                  hopCount++
                  if (hopCount < HOP) return
                  hopCount = 0

                  val lv = AudioBus.levels
                  for (i in 0 until AudioBus.BANDS) {
                      val k = gk[i]
                      var s1 = 0.0
                      var s2 = 0.0
                      var p = ringPos // oldest sample first
                      for (j in 0 until N) {
                          val s0 = ring[p].toDouble() * WIN[j].toDouble() + k * s1 - s2
                          s2 = s1
                          s1 = s0
                          p++
                          if (p == N) p = 0
                      }
                      val power = s1 * s1 + s2 * s2 - k * s1 * s2
                      val amp = sqrt(max(power, 0.0)) / (N / 4.0)
                      val db = 20.0 * log10(amp + 1e-9)
                      lv[i] = ((db + 60.0) / 57.0).coerceIn(0.0, 1.0).toFloat()
                  }
                  AudioBus.lastUpdateNs = System.nanoTime()
              }
          }
          KOTLIN_EOF

          cat > app/src/main/java/com/grey/pulse/PlaybackService.kt << 'KOTLIN_EOF'
          package com.grey.pulse

          import android.content.Context
          import android.content.Intent
          import androidx.annotation.OptIn
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.Player
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.audio.AudioSink
          import androidx.media3.exoplayer.audio.DefaultAudioSink
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          @OptIn(UnstableApi::class)
          class PlaybackService : MediaSessionService() {

              private var session: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val factory = object : DefaultRenderersFactory(this) {
                      override fun buildAudioSink(
                          context: Context,
                          enableFloatOutput: Boolean,
                          enableAudioTrackPlaybackParams: Boolean
                      ): AudioSink {
                          // our processor goes first: EQ + 16-60 Hz analysis
                          return DefaultAudioSink.Builder(context)
                              .setAudioProcessors(arrayOf<AudioProcessor>(BusProcessor()))
                              .build()
                      }
                  }
                  val attrs = AudioAttributes.Builder()
                      .setUsage(C.USAGE_MEDIA)
                      .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                      .build()
                  val player = ExoPlayer.Builder(this, factory)
                      .setAudioAttributes(attrs, true)
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_LOCAL)
                      .build()
                  player.repeatMode = Player.REPEAT_MODE_ALL
                  session = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val p = session?.player
                  if (p == null || !p.playWhenReady || p.mediaItemCount == 0) stopSelf()
              }

              override fun onDestroy() {
                  session?.run {
                      player.release()
                      release()
                  }
                  session = null
                  super.onDestroy()
              }
          }
          KOTLIN_EOF

          cat > app/src/main/java/com/grey/pulse/VisualizerView.kt << 'KOTLIN_EOF'
          package com.grey.pulse

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.floor
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.random.Random

          /**
           * Black disc in the center with layered "solar flare" rings + drifting particles.
           *
           * Layers (inside -> outside):
           *   center + L1 : black   (merged, same colour)
           *   L2          : white, semi glowing
           *   L3          : black
           *   L4          : white, semi glowing
           *
           * Every layer is driven ONLY by the 16-60 Hz bands in AudioBus.levels.
           * The 12 bands are laid over the half circle and mirrored left/right:
           *   bottom = 16 Hz ... top = 60 Hz.
           * Outer layers use older (delayed) levels, so a kick ripples outward.
           */
          class VisualizerView(ctx: Context) : View(ctx) {

              @JvmField var playing = false

              companion object {
                  // ---- tunables ----
                  const val CONTRAST = 2.0f      // higher = only strong bass moves the rings
                  const val ATTACK = 28f         // how fast rings rise
                  const val DECAY = 5f           // how fast rings fall
                  const val SYNC_FRAMES = 6      // compensates audio-buffer latency (~100 ms at 60 fps)
                  const val HIST = 40
                  const val PARTICLES = 160
                  const val POINTS = 160
                  val BASE_R = floatArrayOf(0.30f, 0.42f, 0.54f, 0.66f) // L1..L4 radius (x u)
                  val FLARE = floatArrayOf(0.05f, 0.11f, 0.10f, 0.18f)  // max flare growth
                  val DELAY = intArrayOf(0, 3, 6, 10)                   // frames of ripple delay
                  val WHITE = booleanArrayOf(false, true, false, true)
                  val PIF = Math.PI.toFloat()
              }

              private val nb = AudioBus.BANDS
              private val sm = FloatArray(nb)
              private val hist = Array(HIST) { FloatArray(nb) }
              private var head = 0
              private var lastNs = 0L
              private var time = 0f
              private var energy = 0f
              private val dens = ctx.resources.displayMetrics.density

              private val path = Path()
              private val fillWhite = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(238, 255, 255, 255); style = Paint.Style.FILL
              }
              private val fillBlack = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.BLACK; style = Paint.Style.FILL
              }
              private val glow = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeJoin = Paint.Join.ROUND
              }
              private val dot = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }

              private val px = FloatArray(PARTICLES) { Random.nextFloat() }
              private val py = FloatArray(PARTICLES) { Random.nextFloat() }
              private val psz = FloatArray(PARTICLES) { Random.nextFloat() * 2.5f + 0.6f }
              private val pspd = FloatArray(PARTICLES) { Random.nextFloat() * 0.35f + 0.12f }
              private val pph = FloatArray(PARTICLES) { Random.nextFloat() * 6.28f }
              private val ptw = FloatArray(PARTICLES) { Random.nextFloat() * 1.2f + 0.4f }

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return
                  val now = System.nanoTime()
                  val dt = if (lastNs == 0L) 0.016f else ((now - lastNs) / 1_000_000_000f).coerceIn(0.001f, 0.05f)
                  lastNs = now
                  time += dt
                  updateLevels(dt, now)
                  drawParticles(canvas, w, h)
                  drawRings(canvas, w, h)
                  postInvalidateOnAnimation()
              }

              private fun updateLevels(dt: Float, now: Long) {
                  val fresh = playing && (now - AudioBus.lastUpdateNs) < 250_000_000L
                  val ka = 1f - exp(-dt * ATTACK)
                  val kd = 1f - exp(-dt * DECAY)
                  var sum = 0f
                  for (i in 0 until nb) {
                      val raw = if (fresh) AudioBus.levels[i] else 0f
                      val t = raw.pow(CONTRAST)
                      sm[i] += (t - sm[i]) * (if (t > sm[i]) ka else kd)
                      sum += sm[i]
                  }
                  energy = sum / nb
                  head = (head + 1) % HIST
                  System.arraycopy(sm, 0, hist[head], 0, nb)
              }

              private fun drawParticles(canvas: Canvas, w: Float, h: Float) {
                  for (i in 0 until PARTICLES) {
                      val x = px[i] * w + sin(time * pspd[i] + pph[i]) * 14f * dens
                      val y = py[i] * h + cos(time * pspd[i] * 0.8f + pph[i]) * 18f * dens
                      val tw = 0.5f + 0.5f * sin(time * ptw[i] + pph[i])
                      val a = (0.15f + 0.5f * tw + energy * 0.35f).coerceIn(0f, 1f)
                      val r = psz[i] * dens * 0.5f * (1f + energy * 0.6f)
                      if (psz[i] > 1.6f) {
                          dot.alpha = (a * 70f).toInt()
                          canvas.drawCircle(x, y, r * 2.6f, dot)
                      }
                      dot.alpha = (a * 255f).toInt()
                      canvas.drawCircle(x, y, r, dot)
                  }
              }

              private fun drawRings(canvas: Canvas, w: Float, h: Float) {
                  val cx = w / 2f
                  val cy = h * 0.40f
                  val u = min(w * 0.5f, h * 0.32f)
                  val pulse = 1f + 0.05f * energy
                  val glowGain = 0.6f + 0.8f * energy

                  for (l in 3 downTo 0) {
                      val hh = hist[(head - DELAY[l] - SYNC_FRAMES + HIST * 2) % HIST]
                      path.reset()
                      for (k in 0 until POINTS) {
                          val a = (k.toFloat() / POINTS) * 2f * PIF
                          val f = if (a <= PIF) a / PIF else (2f * PIF - a) / PIF
                          val bp = f * (nb - 1)
                          val i0 = min(floor(bp).toInt(), nb - 2)
                          val fr = bp - i0
                          val s = fr * fr * (3f - 2f * fr)
                          val v = hh[i0] + (hh[i0 + 1] - hh[i0]) * s
                          val wob = 0.014f * sin(5f * a + time * 0.9f + l.toFloat()) +
                              0.009f * sin(3f * a - time * 0.6f)
                          val r = u * (BASE_R[l] * pulse + FLARE[l] * v + wob * 0.6f)
                          val x = cx + r * sin(a)
                          val y = cy + r * cos(a)
                          if (k == 0) path.moveTo(x, y) else path.lineTo(x, y)
                      }
                      path.close()
                      if (WHITE[l]) {
                          for (g in 0..2) {
                              glow.color = Color.WHITE
                              glow.alpha = ((46 - g * 13) * glowGain).toInt().coerceIn(0, 255)
                              glow.strokeWidth = (8f + g * 12f) * dens
                              canvas.drawPath(path, glow)
                          }
                          canvas.drawPath(path, fillWhite)
                      } else {
                          canvas.drawPath(path, fillBlack)
                      }
                  }
              }
          }
          KOTLIN_EOF

          cat > app/src/main/java/com/grey/pulse/MainActivity.kt << 'KOTLIN_EOF'
          package com.grey.pulse

          import android.Manifest
          import android.content.ComponentName
          import android.content.Context
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.SystemBarStyle
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
