          @Composable
          fun VizPanel(vm: PlayerVm) {
              var tick by remember { mutableStateOf(0) }
              val t = tick // read so the sliders redraw
              fun changed() { tick++; vm.saveCfg() }

              fun lin(v: Float, lo: Float, hi: Float) = (v - lo) / (hi - lo)
              fun unlin(f: Float, lo: Float, hi: Float) = lo + f * (hi - lo)
              // log scale for Hz ranges (a bit more room at the low end)
              fun logF(v: Int, lo: Float, hi: Float) = (Math.log((v / lo).toDouble()) / Math.log((hi / lo).toDouble())).toFloat()
              fun unlogF(f: Float, lo: Float, hi: Float) = (lo * Math.pow((hi / lo).toDouble(), f.toDouble())).roundToInt()

              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier.fillMaxWidth().padding(start = 4.dp, end = 4.dp, top = 6.dp, bottom = 4.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(Modifier.weight(1f)) {
                          Text("Visualizer", color = CText, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          Text("SETTINGS SAVE AUTOMATICALLY", color = CDim, fontSize = 10.sp, letterSpacing = 0.6.sp)
                      }
                      Box(
                          Modifier.height(34.dp).clip(RoundedCornerShape(10.dp)).background(Color(0x14FFFFFF))
                              .tap { vm.resetCfg(); tick++ }.padding(horizontal = 14.dp),
                          contentAlignment = Alignment.Center
                      ) { Text("Reset", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold) }
                  }
                  LazyColumn(Modifier.weight(1f).fillMaxWidth()) {
                      item {
                        Column(Modifier.fillMaxWidth()) {
                          val bass = t
                          SectionTitle("Bass (center flares)", "Top flare = low end, bottom flare = high end")
                          SliderRow("Low end (top)", Cfg.bassLo.toString() + " Hz", logF(Cfg.bassLo, 5f, 100f)) {
                              Cfg.bassLo = unlogF(it, 5f, 100f).coerceIn(5, 100)
                              if (Cfg.bassHi < Cfg.bassLo + 5) Cfg.bassHi = Cfg.bassLo + 5
                              changed()
                          }
                          SliderRow("High end (bottom)", Cfg.bassHi.toString() + " Hz", logF(Cfg.bassHi, 20f, 250f)) {
                              Cfg.bassHi = unlogF(it, 20f, 250f).coerceIn(20, 250)
                              if (Cfg.bassHi < Cfg.bassLo + 5) Cfg.bassLo = (Cfg.bassHi - 5).coerceAtLeast(5)
                              changed()
                          }
                          SliderRow("Sensitivity", "%.2fx".format(Cfg.bassSens), lin(Cfg.bassSens, 0.2f, 3f)) {
                              Cfg.bassSens = unlin(it, 0.2f, 3f); changed()
                          }

                          SectionTitle("Mid motion (rocking)", "The center moves randomly with this range")
                          SliderRow("Low end", Cfg.midLo.toString() + " Hz", logF(Cfg.midLo, 200f, 6000f)) {
                              Cfg.midLo = unlogF(it, 200f, 6000f).coerceIn(200, 6000)
                              if (Cfg.midHi < Cfg.midLo + 200) Cfg.midHi = Cfg.midLo + 200
                              changed()
                          }
                          SliderRow("High end", Cfg.midHi.toString() + " Hz", logF(Cfg.midHi, 400f, 12000f)) {
                              Cfg.midHi = unlogF(it, 400f, 12000f).coerceIn(400, 12000)
                              if (Cfg.midHi < Cfg.midLo + 200) Cfg.midLo = (Cfg.midHi - 200).coerceAtLeast(200)
                              changed()
                          }
                          SliderRow("Sensitivity", "%.2fx".format(Cfg.midSens), lin(Cfg.midSens, 0.2f, 3f)) {
                              Cfg.midSens = unlin(it, 0.2f, 3f); changed()
                          }
                          SliderRow("Movement amount", "%.2fx".format(Cfg.midMove), lin(Cfg.midMove, 0f, 2f)) {
                              Cfg.midMove = unlin(it, 0f, 2f); changed()
                          }

                          SectionTitle("Beat", "Center pops bigger, particles scatter away")
                          SliderRow("Detection sensitivity", "%.2fx".format(Cfg.beatSens), lin(Cfg.beatSens, 0.3f, 3f)) {
                              Cfg.beatSens = unlin(it, 0.3f, 3f); changed()
                          }
                          SliderRow("Pop strength", "%.2fx".format(Cfg.popStrength), lin(Cfg.popStrength, 0f, 2.5f)) {
                              Cfg.popStrength = unlin(it, 0f, 2.5f); changed()
                          }
                          SliderRow("Scatter strength", "%.2fx".format(Cfg.scatter), lin(Cfg.scatter, 0f, 3f)) {
                              Cfg.scatter = unlin(it, 0f, 3f); changed()
                          }
                          SliderRow("Sync offset", Cfg.syncMs.toString() + " ms", lin(Cfg.syncMs.toFloat(), 0f, 400f)) {
                              Cfg.syncMs = unlin(it, 0f, 400f).roundToInt(); changed()
                          }

                          SectionTitle("Particles", "")
                          SliderRow("Size", "%.2fx".format(Cfg.pSize), lin(Cfg.pSize, 0.3f, 3f)) {
                              Cfg.pSize = unlin(it, 0.3f, 3f); changed()
                          }
                          SliderRow("Rumble sensitivity", "%.2fx".format(Cfg.pRumble), lin(Cfg.pRumble, 0f, 3f)) {
                              Cfg.pRumble = unlin(it, 0f, 3f); changed()
                          }
                          SliderRow("Density", Cfg.pCount.toString(), lin(Cfg.pCount.toFloat(), 10f, 600f)) {
                              Cfg.pCount = unlin(it, 10f, 600f).roundToInt(); changed()
                          }
                          Box(Modifier.height(20.dp))
                        }
                      }
                  }
              }
          }

