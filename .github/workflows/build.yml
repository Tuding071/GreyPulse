                          val s = (o[i] / p95).coerceIn(0.0, 1.0).toFloat() * 0.7f + 0.3f
                          ev.add(Triple(i, s, 0))
                          lastK = i
                      }
                  }

                  // ---- bars and phrases: the beat position (0..3) with the strongest kicks is the "1"
                  if (beats.size >= 8) {
                      val sum = DoubleArray(4)
                      val cnt = IntArray(4)
                      for (k in beats.indices) {
                          sum[k % 4] += e[beats[k]]
                          cnt[k % 4]++
                      }
                      var down = 0
                      var bm = -1.0
                      for (q in 0 until 4) {
                          val mm = if (cnt[q] > 0) sum[q] / cnt[q] else 0.0
                          if (mm > bm) { bm = mm; down = q }
                      }
                      var bar = 0
                      var k = down
                      while (k < beats.size) {
                          val fr = beats[k]
                          val kind = if (bar % 8 == 0) 2 else 1
                          var hit = -1
                          for (x in ev.indices) if (abs(ev[x].first - fr) <= 3) { hit = x; break }
                          if (hit >= 0) {
                              val old = ev[hit]
                              ev[hit] = Triple(old.first, max(old.second, 0.8f), kind)
                          } else {
                              ev.add(Triple(fr, 0.8f, kind))
                          }
                          bar++
                          k += 4
                      }
                  }
                  ev.sortBy { it.first }
                  val t = FloatArray(ev.size) { SongMap.frameTime(ev[it].first).toFloat() }
                  val s = ByteArray(ev.size) { (ev[it].second.coerceIn(0f, 1f) * 255f).toInt().toByte() }
                  val kd = ByteArray(ev.size) { ev[it].third.toByte() }
                  return SongMap(bpm, kb, bb, t, s, kd)
              }
          }
