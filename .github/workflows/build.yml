          package com.grey.pulse

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.floor
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.random.Random

          interface VizSource {
              /** Player position in seconds right now (not yet corrected for speaker delay). */
              fun posSec(): Double
              /** Saved analysis of the song that is playing, or null if it has none yet. */
              fun map(): SongMap?
              /** Changes when the song changes. */
              fun key(): String
          }

          /**
           * Trap-Nation style center, inside -> outside:
           *   black disc (thumps bigger on every kick) / white glowing ring / black gap / white glowing radial bars.
           * Bars show the bass range (top = low Hz end, bottom = high Hz end, mirrored left/right) and trail:
           * two older copies (100 ms and 200 ms ago) are drawn dimmer behind the live one.
           * Kicks, bars and 8-bar phrases come from the saved stem analysis (exact times) when the song
           * has one, otherwise from the live detector. Mid range (default 1-4 kHz) makes the center wander.
           * Kicks also scatter the particles; the bass makes them rumble.
           */
          class VisualizerView(ctx: Context) : View(ctx) {

              @JvmField var playing = false
              @JvmField var source: VizSource? = null

              companion object {
                  const val CONTRAST = 2.0f
                  const val ATTACK = 28f
                  const val DECAY = 5f
                  const val TAIL_MS = 100
                  const val HIST = 128
                  const val MAXP = 600
                  const val BARS = 96
                  val PIF = Math.PI.toFloat()
              }

              private val nb = AudioBus.BANDS
              private val sm = FloatArray(nb)
              private val hist = Array(HIST) { FloatArray(nb) }
              private val hT = FloatArray(HIST)
              private val hMid = FloatArray(HIST)
              private var head = 0
              private var hCount = 0
              private var lastNs = 0L
              private var time = 0f
              private var energy = 0f
              private var midBase = 0f
              private var midSm = 0f
              private var midPrev = 0f
              private val dens = ctx.resources.displayMetrics.density

              // wandering (no tilt)
              private var mx = 0f
              private var my = 0f
              private var mvx = 0f
              private var mvy = 0f
              private var ox = 0f
              private var oy = 0f

              // beats
              private var pop = 0f
              private var kickBody = 0f
              private var bassBody = 0f
              private var pendingScatter = 0f
              private var lastSeen = AudioBus.beatHead
              private val pendNs = LongArray(16)
              private val pendS = FloatArray(16)
              private val pendK = IntArray(16)
              private var pendN = 0

              // saved-map playback
              private var curMap: SongMap? = null
              private var curKey = ""
              private var lastPos = -1.0
              private var evIdx = 0
              @JvmField var usingMap = false

              private var cx = 0f
              private var cy = 0f
              private var uu = 1f

              private val fillBlack = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.BLACK; style = Paint.Style.FILL }
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; color = Color.WHITE }
              private val bar = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; color = Color.WHITE; strokeCap = Paint.Cap.ROUND
              }
              private val dot = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }

              private val px = FloatArray(MAXP) { Random.nextFloat() }
              private val py = FloatArray(MAXP) { Random.nextFloat() }
              private val psz = FloatArray(MAXP) { Random.nextFloat() * 2.5f + 0.6f }
              private val pspd = FloatArray(MAXP) { Random.nextFloat() * 0.35f + 0.12f }
              private val pph = FloatArray(MAXP) { Random.nextFloat() * 6.28f }
              private val ptw = FloatArray(MAXP) { Random.nextFloat() * 1.2f + 0.4f }
              private val pjit = FloatArray(MAXP) { Random.nextFloat() }
              private val sc = FloatArray(MAXP)
              private val sv = FloatArray(MAXP)

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return
                  val now = System.nanoTime()
                  val dt = if (lastNs == 0L) 0.016f else ((now - lastNs) / 1_000_000_000f).coerceIn(0.001f, 0.05f)
                  lastNs = now
                  time += dt
                  cx = w / 2f
                  cy = h * 0.40f
                  uu = min(w * 0.5f, h * 0.32f)

                  updateLevels(dt, now)
                  processBeats(now, dt)
                  updateMotion(dt)
                  drawParticles(canvas, w, h, dt)
                  drawCenter(canvas)
                  postInvalidateOnAnimation()
              }

              // ------------------------------------------------------------ levels + history
              private fun updateLevels(dt: Float, now: Long) {
                  val fresh = playing && (now - AudioBus.lastUpdateNs) < 250_000_000L
                  val ka = 1f - exp(-dt * ATTACK)
                  val kd = 1f - exp(-dt * DECAY)
                  val sens = Cfg.bassSens
                  var sum = 0f
                  for (i in 0 until nb) {
                      val raw = if (fresh) AudioBus.levels[i] else 0f
                      val t = (raw * sens).coerceIn(0f, 1.5f).pow(CONTRAST)
                      sm[i] += (t - sm[i]) * (if (t > sm[i]) ka else kd)
                      sum += sm[i]
                  }
                  energy = sum / nb

                  val midRaw = if (fresh) AudioBus.mid else 0f
                  midBase += (midRaw - midBase) * min(1f, dt / 4f)
                  val m = if (fresh) (((midRaw - midBase) * 4f + 0.3f) * Cfg.midSens).coerceIn(0f, 1.2f) else 0f
                  midSm += (m - midSm) * (1f - exp(-dt * (if (m > midSm) 20f else 4f)))

                  head = (head + 1) % HIST
                  System.arraycopy(sm, 0, hist[head], 0, nb)
                  hT[head] = time
                  hMid[head] = midSm
                  if (hCount < HIST) hCount++
              }

              private fun idxAt(tTarget: Float): Int {
                  var i = head
                  var n = 0
                  while (n < hCount) {
                      if (hT[i] <= tTarget) return i
                      i = (i - 1 + HIST) % HIST
                      n++
                  }
                  return (head - hCount + 1 + HIST) % HIST
              }

              // ------------------------------------------------------------ beats
              private fun processBeats(now: Long, dt: Float) {
                  val src = source
                  val m = src?.map()
                  usingMap = m != null
                  if (src != null && m != null) {
                      mapBeats(src, m)
                  } else {
                      liveBeats(now)
                      kickBody *= exp(-dt * 8f)
                      bassBody *= exp(-dt * 8f)
                  }
                  pop *= exp(-dt * 6.5f)
              }

              private fun mapBeats(src: VizSource, m: SongMap) {
                  val key = src.key()
                  if (m !== curMap || key != curKey) {
                      curMap = m; curKey = key; lastPos = -1.0
                  }
                  // keep the live queue empty so it doesn't fire later
                  lastSeen = AudioBus.beatHead
                  pendN = 0
                  val pos = src.posSec() - Cfg.syncMs / 1000.0
                  kickBody = m.envAt(m.kickEnv, pos)
                  bassBody = m.envAt(m.bassEnv, pos)
                  if (!playing) { lastPos = -1.0; return } // resync on resume / after a seek while paused
                  if (lastPos < 0.0 || pos < lastPos - 0.05 || pos > lastPos + 0.5) {
                      lastPos = pos
                      evIdx = m.firstAfter(pos)
                      return
                  }
                  while (evIdx < m.evT.size && m.evT[evIdx] <= pos) {
                      fireBeat((m.evS[evIdx].toInt() and 255) / 255f, m.evK[evIdx].toInt())
                      evIdx++
                  }
                  lastPos = pos
              }

              private fun liveBeats(now: Long) {
                  val headNow = AudioBus.beatHead
                  if (headNow != lastSeen) {
                      var i = max(lastSeen, headNow - AudioBus.QN)
                      while (i < headNow) {
                          val k = i % AudioBus.QN
                          val ns = AudioBus.beatNs[k]
                          if (now - ns < 1_500_000_000L && pendN < 16) {
                              pendNs[pendN] = ns + Cfg.syncMs * 1_000_000L
                              pendS[pendN] = AudioBus.beatStr[k]
                              pendK[pendN] = AudioBus.beatKind[k]
                              pendN++
                          }
                          i++
                      }
                      lastSeen = headNow
                  }
                  var j = 0
                  while (j < pendN) {
                      if (pendNs[j] <= now) {
                          fireBeat(pendS[j], pendK[j])
                          pendN--
                          pendNs[j] = pendNs[pendN]
                          pendS[j] = pendS[pendN]
                          pendK[j] = pendK[pendN]
                      } else {
                          j++
                      }
                  }
              }

              private fun fireBeat(str: Float, kind: Int) {
                  val mult = when (kind) {
                      1 -> 1.45f
                      2 -> 2.0f
                      else -> 1f
                  }
                  val v = str * mult
                  if (v > pop) pop = v
                  pendingScatter += v * Cfg.scatter * (if (kind == 0) 0.7f else 1f)
              }

              // ------------------------------------------------------------ wandering motion (no tilt)
              private fun updateMotion(dt: Float) {
                  val mLvl = hMid[idxAt(time - Cfg.syncMs / 1000f)]
                  val dm = mLvl - midPrev
                  midPrev = mLvl
                  val mv = Cfg.midMove
                  if (dm > 0.05f && mv > 0f) {
                      val ang = Random.nextFloat() * 2f * PIF
                      val mag = dm * mv
                      mvx += cos(ang) * mag * 2.8f * uu
                      mvy += sin(ang) * mag * 2.8f * uu
                  }
                  mvx += (-12f * mx - 4.5f * mvx) * dt
                  mvy += (-12f * my - 4.5f * mvy) * dt
                  mx = (mx + mvx * dt).coerceIn(-0.25f * uu, 0.25f * uu)
                  my = (my + mvy * dt).coerceIn(-0.25f * uu, 0.25f * uu)

                  val wx = (sin(time * 0.61f + 1.3f) + 0.6f * sin(time * 1.07f + 4.2f)) * 0.5f
                  val wy = (sin(time * 0.53f + 2.1f) + 0.6f * sin(time * 0.91f + 0.4f)) * 0.5f
                  val amp = mLvl * mv
                  ox = mx + wx * uu * 0.10f * amp
                  oy = my + wy * uu * 0.10f * amp
              }

              // ------------------------------------------------------------ particles
              private fun drawParticles(canvas: Canvas, w: Float, h: Float, dt: Float) {
                  val n = Cfg.pCount.coerceIn(10, MAXP)
                  val imp = pendingScatter
                  pendingScatter = 0f
                  val hh = hist[idxAt(time - Cfg.syncMs / 1000f)]
                  var be = 0f
                  for (i in 0 until nb) be += hh[i]
                  be /= nb
                  if (usingMap) be = max(be, bassBody * 0.8f)
                  val rum = Cfg.pRumble * be * 2.2f
                  val sizeMul = Cfg.pSize

                  for (i in 0 until n) {
                      val bx = px[i] * w + sin(time * pspd[i] + pph[i]) * 14f * dens
                      val by = py[i] * h + cos(time * pspd[i] * 0.8f + pph[i]) * 18f * dens
                      val dx = bx - (cx + ox)
                      val dy = by - (cy + oy)
                      val dist = sqrt(dx * dx + dy * dy) + 1f
                      val ux = dx / dist
                      val uy = dy / dist
                      val infl = 1f / (1f + dist / (0.9f * uu))

                      if (imp > 0f) sv[i] += imp * 380f * dens * (0.5f + pjit[i]) * infl * 1.6f
                      sv[i] += (-6f * sc[i] - 3.2f * sv[i]) * dt
                      sc[i] += sv[i] * dt

                      val osc = sin(time * (14f + pjit[i] * 10f) + pph[i] * 3f)
                      val off = sc[i] + rum * 14f * dens * osc * infl
                      val perp = rum * 4f * dens * sin(time * 23f + pph[i] * 5f) * infl
                      val x = bx + ux * off - uy * perp
                      val y = by + uy * off + ux * perp

                      val tw = 0.5f + 0.5f * sin(time * ptw[i] + pph[i])
                      val a = (0.15f + 0.5f * tw + energy * 0.35f + pop * 0.25f).coerceIn(0f, 1f)
                      val r = psz[i] * dens * 0.5f * sizeMul * (1f + be * 0.5f)
                      if (psz[i] > 1.6f) {
                          dot.alpha = (a * 70f).toInt()
                          canvas.drawCircle(x, y, r * 2.6f, dot)
                      }
                      dot.alpha = (a * 255f).toInt()
                      canvas.drawCircle(x, y, r, dot)
                  }
              }

              // ------------------------------------------------------------ center
              private fun barLevel(hh: FloatArray, a: Float, k: Int): Float {
                  val t = 0.5f + 0.5f * cos(a)          // 0 at the top (low Hz) .. 1 at the bottom (high Hz)
                  val bp = t * (nb - 1)
                  val i0 = min(floor(bp).toInt(), nb - 2)
                  val fr = bp - i0
                  val s = fr * fr * (3f - 2f * fr)
                  val v = hh[i0] + (hh[i0 + 1] - hh[i0]) * s
                  val jit = 0.86f + 0.14f * sin(k * 12.9898f + time * 3.1f)
                  return v * jit
              }

              private fun drawCenter(canvas: Canvas) {
                  val ccx = cx + ox
                  val ccy = cy + oy
                  val scale = 1f + (0.16f * pop * Cfg.popStrength).coerceAtMost(0.5f) + 0.03f * kickBody
                  val r0 = uu * 0.30f * scale
                  val gain = 0.75f + 0.7f * (if (usingMap) bassBody else energy)
                  val glowGain = 0.6f + 0.8f * energy + 0.7f * pop + 0.5f * kickBody

                  // black gap behind everything of the center, so the bars float on pure black
                  canvas.drawCircle(ccx, ccy, r0 * 1.27f, fillBlack)

                  // radial bars, oldest echo first
                  for (d in 2 downTo 0) {
                      val hh = hist[idxAt(time - (Cfg.syncMs + d * TAIL_MS) / 1000f)]
                      val alpha = when (d) { 2 -> 0.22f; 1 -> 0.45f; else -> 1f }
                      val w = (2.4f * dens) * (if (d == 0) 1f else 0.8f)
                      val rb = r0 * 1.32f
                      for (k in 0 until BARS) {
                          val a = k.toFloat() / BARS * 2f * PIF
                          val v = barLevel(hh, a, k).coerceIn(0f, 1.3f) * gain
                          val len = uu * (0.025f + 0.30f * v) * (1f + 0.25f * pop)
                          val sx = ccx + rb * sin(a)
                          val sy = ccy + rb * cos(a)
                          val ex = ccx + (rb + len) * sin(a)
                          val ey = ccy + (rb + len) * cos(a)
                          if (d == 0) {
                              bar.strokeWidth = w * 3.2f
                              bar.alpha = (28f * glowGain).toInt().coerceIn(0, 255)
                              canvas.drawLine(sx, sy, ex, ey, bar)
                          }
                          bar.strokeWidth = w
                          bar.alpha = (235f * alpha).toInt()
                          canvas.drawLine(sx, sy, ex, ey, bar)
                      }
                  }

                  // white glowing ring
                  for (g in 0..2) {
                      ring.strokeWidth = (5f + g * 9f) * dens
                      ring.alpha = ((52 - g * 15) * glowGain).toInt().coerceIn(0, 255)
                      canvas.drawCircle(ccx, ccy, r0 * 1.12f, ring)
                  }
                  ring.strokeWidth = 2.6f * dens
                  ring.alpha = 240
                  canvas.drawCircle(ccx, ccy, r0 * 1.12f, ring)

                  // black center disc
                  canvas.drawCircle(ccx, ccy, r0, fillBlack)
              }
          }
