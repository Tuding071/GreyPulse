                  val st = max(0, (n - tT).toInt())
                  var end = st
                  for (i in st until n) if (c[i] > c[end]) end = i
                  val beatsRev = ArrayList<Int>()
                  var cur = end
                  while (cur >= 0) { beatsRev.add(cur); cur = prev[cur] }
                  val beats = beatsRev.reversed()

                  // ---- kick hits: peaks of the onset strength
                  val os = FloatArray(n) { o[it].toFloat() }
                  os.sort()
                  val p95 = max(p(os, 0.95f), 1e-6f)
                  val ev = ArrayList<Triple<Int, Float, Int>>() // frame, strength 0..1, kind
                  var lastK = -10
                  for (i in 2 until n - 2) {
                      var m = 0.0
                      val a = max(0, i - 10)
                      val b = min(n - 1, i + 10)
                      for (k in a..b) m += o[k]
