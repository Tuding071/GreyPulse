          @Composable
          fun VizAddPanel(vm: PlayerVm, onGuide: () -> Unit, onDone: () -> Unit) {
              val ctx = LocalContext.current
              var draft by remember { mutableStateOf("") }
              val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  if (uri != null) {
                      try {
                          val bytes = ctx.contentResolver.openInputStream(uri)?.use { it.readBytes() }
                          if (bytes != null && bytes.size <= 4_000_000) {
                              draft = String(bytes, Charsets.UTF_8)
                          } else {
                              Toast.makeText(ctx, "File too big or unreadable", Toast.LENGTH_SHORT).show()
                          }
                      } catch (e: Exception) {
                          Toast.makeText(ctx, "Could not read the file", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
              fun paste() {
                  val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = cm.primaryClip
                  val t = if (clip != null && clip.itemCount > 0) clip.getItemAt(0).coerceToText(ctx).toString() else ""
                  if (t.isBlank()) Toast.makeText(ctx, "Clipboard is empty", Toast.LENGTH_SHORT).show() else draft = t
              }
              val has = draft.isNotBlank() && draft.contains("<")
              val name = if (has) VizStore.parseName(draft) else ""

              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier.fillMaxWidth().padding(start = 4.dp, end = 4.dp, top = 6.dp, bottom = 12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(Modifier.weight(1f)) {
                          Text("Add Visualizer", color = CText, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          Text("PASTE OR IMPORT ONE HTML FILE", color = CDim, fontSize = 10.sp, letterSpacing = 0.6.sp)
                      }
                      Box(
                          Modifier.size(36.dp).clip(CircleShape).background(Color(0x1AFFFFFF)).tap(onGuide),
                          contentAlignment = Alignment.Center
                      ) { Text("?", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold) }
                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      PillBtn("Paste", Modifier.weight(1f)) { paste() }
                      PillBtn("Import file", Modifier.weight(1f)) { picker.launch("*/*") }
                      PillBtn("Clear", Modifier.weight(1f), enabled = draft.isNotEmpty()) { draft = "" }
                  }
                  Box(Modifier.height(12.dp))
                  Column(
                      Modifier
                          .weight(1f)
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(12.dp))
                          .background(Color(0x10FFFFFF))
                          .border(1.dp, Color(0x1AFFFFFF), RoundedCornerShape(12.dp))
                          .verticalScroll(rememberScrollState())
                          .padding(12.dp)
                  ) {
                      if (draft.isEmpty()) {
                          Text(
                              "Nothing yet.\nTap ? for the guide you can give to any AI, copy the HTML it makes, then tap Paste.",
                              color = CDim, fontSize = 12.sp, lineHeight = 18.sp
                          )
                      } else {
                          Text(
                              "Name: " + (if (has) name else "(not HTML?)") + "   " + (draft.length / 1024 + 1) + " KB",
                              color = if (has) CGreen else CHeart, fontSize = 12.sp, fontWeight = FontWeight.Bold
                          )
                          Box(Modifier.height(8.dp))
                          Text(
                              draft.take(1500) + (if (draft.length > 1500) "\n..." else ""),
                              color = CDim, fontSize = 10.sp, lineHeight = 14.sp, fontFamily = FontFamily.Monospace
                          )
                      }
                  }
                  Box(Modifier.height(10.dp))
                  PillBtn("Add to list", Modifier.fillMaxWidth(), enabled = has, primary = true) {
                      val item = vm.addViz(draft)
                      Toast.makeText(ctx, "Added: " + item.name, Toast.LENGTH_SHORT).show()
                      draft = ""
                      onDone()
                  }
                  Box(Modifier.height(8.dp))
              }
          }

