          // ---------------------------------------------------------------- root
          @Composable
          fun PulseApp() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val vm = remember { PlayerVm(ctx.applicationContext, scope) }
              var panel by remember { mutableStateOf(Panel.None) }
              var pendingDelete by remember { mutableStateOf<Int?>(null) }
              var pendingViz by remember { mutableStateOf<String?>(null) }
              var uiVisible by remember { mutableStateOf(true) }
              val manualScan = remember { booleanArrayOf(false) }

              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  vm.scan(manualScan[0])
                  manualScan[0] = false
              }

              fun requestAndScan(manual: Boolean) {
                  manualScan[0] = manual
                  val perms = if (Build.VERSION.SDK_INT >= 33)
                      arrayOf(Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.POST_NOTIFICATIONS)
                  else arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  val need = perms.filter { ContextCompat.checkSelfPermission(ctx, it) != PackageManager.PERMISSION_GRANTED }
                  if (need.isEmpty()) {
                      vm.scan(manual)
                      manualScan[0] = false
                  } else {
                      permLauncher.launch(need.toTypedArray())
                  }
              }

              fun back() {
                  panel = when (panel) {
                      Panel.Guide -> Panel.VizAdd
                      Panel.VizAdd, Panel.VizList, Panel.Eq -> Panel.Menu
                      else -> Panel.None
                  }
              }

              LaunchedEffect(Unit) { requestAndScan(false) }

              DisposableEffect(Unit) {
                  val token = SessionToken(ctx, ComponentName(ctx, PlaybackService::class.java))
                  val future = MediaController.Builder(ctx, token).buildAsync()
                  future.addListener({
                      try {
                          vm.attach(future.get())
                      } catch (e: Exception) {
                      }
                  }, ContextCompat.getMainExecutor(ctx))
                  onDispose {
                      vm.detach()
                      MediaController.releaseFuture(future)
                  }
              }

              LaunchedEffect(Unit) {
                  while (true) {
                      vm.pollPos()
                      delay(250)
                  }
              }

              BackHandler(enabled = panel != Panel.None) { back() }
              // registered last = wins: Back brings the app controls back after a visualizer hid them
              BackHandler(enabled = !uiVisible) { uiVisible = true }

              Box(Modifier.fillMaxSize().background(GreyBg)) {
                  VizLayer(vm) { uiVisible = it; if (!it) panel = Panel.None }

                  if (uiVisible) {
                      Column(Modifier.fillMaxSize()) {
                          TopBar(
                              vm = vm,
                              panel = panel,
                              onLeft = { if (panel == Panel.None) panel = Panel.List else back() },
                              onRight = { panel = Panel.Menu }
                          )
                          Box(Modifier.weight(1f).fillMaxWidth()) {
                              Overlay(panel == Panel.List) {
                                  ListPanel(vm) { panel = Panel.None }
                              }
                              Overlay(panel == Panel.Menu) {
                                  MenuPanel(
                                      onEq = { panel = Panel.Eq },
                                      onVizAdd = { panel = Panel.VizAdd },
                                      onVizList = { panel = Panel.VizList },
                                      onScan = { panel = Panel.None; requestAndScan(true) }
                                  )
                              }
                              Overlay(panel == Panel.VizList) {
                                  VizListPanel(vm, onPicked = { panel = Panel.None }, askDelete = { id -> pendingViz = id })
                              }
                              Overlay(panel == Panel.VizAdd) {
                                  VizAddPanel(vm, onGuide = { panel = Panel.Guide }, onDone = { panel = Panel.VizList })
                              }
                              Overlay(panel == Panel.Guide) {
                                  GuidePanel()
                              }
                              Overlay(panel == Panel.Eq) {
                                  EqPanel(vm) { idx -> pendingDelete = idx }
                              }
                          }
                          Controls(vm)
                      }
                  }

                  val pd = pendingDelete
                  if (pd != null && pd in vm.eqBands.indices) {
                      val band = vm.eqBands[pd]
                      ConfirmDelete(
                          title = "Delete band?",
                          msg = "Remove the " + band.freq + " Hz band from your equalizer?",
                          onCancel = { pendingDelete = null },
                          onDelete = {
                              vm.eqBands = vm.eqBands.filterIndexed { i, _ -> i != pd }
                              vm.pushEq()
                              pendingDelete = null
                          }
                      )
                  }
                  val pv = pendingViz
                  if (pv != null) {
                      val nm = vm.vizList.firstOrNull { it.id == pv }?.name ?: "this visualizer"
                      ConfirmDelete(
                          title = "Delete visualizer?",
                          msg = "Remove \"" + nm + "\" from your list?",
                          onCancel = { pendingViz = null },
                          onDelete = {
                              vm.removeViz(pv)
                              pendingViz = null
                          }
                      )
                  }
              }
          }

