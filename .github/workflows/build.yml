          @Composable
          fun AddForm(vm: PlayerVm) {
              var text by remember { mutableStateOf("") }
              val value = text.toIntOrNull()
              val valid = value != null && value in 1..20000

              fun add() {
                  val f = text.toIntOrNull() ?: return
                  if (f !in 1..20000) return
                  if (vm.eqBands.none { it.freq == f }) {
                      vm.eqBands = (vm.eqBands + EqBand(f, 0)).sortedBy { it.freq }
                      vm.pushEq()
                  }
                  text = ""
              }

              Row(
                  Modifier.fillMaxWidth().padding(start = 4.dp, end = 4.dp, top = 10.dp, bottom = 12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Row(
                      Modifier
                          .weight(1f)
                          .height(40.dp)
                          .clip(RoundedCornerShape(12.dp))
                          .background(Color(0x10FFFFFF))
                          .border(1.dp, Color(0x1AFFFFFF), RoundedCornerShape(12.dp))
                          .padding(horizontal = 10.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      BasicTextField(
                          value = text,
                          onValueChange = { v -> text = v.filter { it.isDigit() }.take(5) },
                          singleLine = true,
                          textStyle = TextStyle(color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.SemiBold),
                          cursorBrush = SolidColor(Color.White),
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number, imeAction = ImeAction.Done),
                          keyboardActions = KeyboardActions(onDone = { add() }),
                          modifier = Modifier.weight(1f),
                          decorationBox = { inner ->
                              Box(contentAlignment = Alignment.CenterStart) {
                                  if (text.isEmpty()) Text("Frequency", color = Color(0x55FFFFFF), fontSize = 14.sp)
                                  inner()
                              }
                          }
                      )
                      Text("HZ", color = CDim, fontSize = 11.sp, letterSpacing = 0.6.sp)
                  }
                  Box(Modifier.width(8.dp))
                  Row(
                      Modifier
                          .height(40.dp)
                          .alpha(if (valid) 1f else 0.35f)
                          .clip(RoundedCornerShape(12.dp))
                          .background(Brush.linearGradient(listOf(Color(0xFFF7F7FA), Color(0xFFC9C9D2))))
                          .clickable(
                              interactionSource = remember { MutableInteractionSource() },
                              indication = null,
                              enabled = valid
                          ) { add() }
                          .padding(horizontal = 14.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      IconPlus()
                      Box(Modifier.width(6.dp))
                      Text("Add", color = Color(0xFF0E0E10), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                  }
              }
          }

          fun gainFor(x: Float, w: Float): Int = (-50f + (x / w).coerceIn(0f, 1f) * 50f).roundToInt()

          @Composable
          fun BandRow(b: EqBand, enabled: Boolean, onGain: (Int) -> Unit, onDelete: () -> Unit) {
              val cb by rememberUpdatedState(onGain)
              var wPx by remember { mutableStateOf(1f) }
              val pct = ((b.gain + 50) / 50f).coerceIn(0f, 1f)
              Row(
                  Modifier.fillMaxWidth().padding(horizontal = 10.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(
                      b.freq.toString() + " Hz", color = Color(0xCCFFFFFF), fontSize = 12.sp,
                      fontWeight = FontWeight.SemiBold, modifier = Modifier.width(56.dp)
                  )
                  Box(
                      Modifier
                          .weight(1f)
                          .height(32.dp)
                          .onSizeChanged { wPx = it.width.toFloat().coerceAtLeast(1f) }
                          .pointerInput(enabled) {
                              if (!enabled) return@pointerInput
                              detectTapGestures { o -> cb(gainFor(o.x, wPx)) }
                          }
                          .pointerInput(enabled) {
                              if (!enabled) return@pointerInput
                              detectHorizontalDragGestures(
                                  onDragStart = { o -> cb(gainFor(o.x, wPx)) },
                                  onHorizontalDrag = { ch, _ -> cb(gainFor(ch.position.x, wPx)) }
                              )
                          },
                      contentAlignment = Alignment.CenterStart
                  ) {
                      Box(Modifier.fillMaxWidth().height(4.dp).clip(RoundedCornerShape(99.dp)).background(CSurf3))
                      Box(
                          Modifier.fillMaxWidth(pct).height(4.dp).clip(RoundedCornerShape(99.dp))
                              .background(Color(0xCCFFFFFF))
                      )
                      Box(
                          Modifier
                              .offset { IntOffset((pct * wPx - 7.dp.toPx()).roundToInt(), 0) }
                              .size(14.dp)
                              .clip(CircleShape)
                              .background(Color.White)
                      )
                  }
                  Text(
                      b.gain.toString() + " dB", color = CDim, fontSize = 11.sp, textAlign = TextAlign.End,
                      modifier = Modifier.width(52.dp)
                  )
                  Box(
                      Modifier
                          .size(26.dp)
                          .clip(CircleShape)
                          .background(Color(0x10FFFFFF))
                          .tap(onDelete),
                      contentAlignment = Alignment.Center
                  ) {
                      Text("x", color = Color(0x88FFFFFF), fontSize = 14.sp)
                  }
              }
          }

