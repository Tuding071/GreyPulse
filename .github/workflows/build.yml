name: Build GreyPulse

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-greypulse-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: gradle-greypulse-

      - name: Generate project structure
        run: |
          mkdir -p app/src/main/java/com/grey/pulse
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GreyPulse"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.0" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=36
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts << 'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          val buildNum = (System.getenv("BUILD_NUMBER") ?: "1").toInt()

          android {
              namespace = "com.grey.pulse"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.grey.pulse"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = buildNum
                  versionName = buildNum.toString()
              }

              signingConfigs {
                  create("dummy") {
                      storeFile = file("dummy.keystore")
                      storePassword = "password"
                      keyAlias = "dummy"
                      keyPassword = "password"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      isDebuggable = false
                      signingConfig = signingConfigs.getByName("dummy")
                  }
              }

              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a")
                      isUniversalApk = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
              }

              androidResources {
                  noCompress += listOf("onnx")
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2025.05.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.media3:media3-common:1.8.0")
              implementation("androidx.media3:media3-exoplayer:1.8.0")
              implementation("androidx.media3:media3-session:1.8.0")
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.20.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:largeHeap="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="GreyPulse"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#FF0E0E10</item>
                  <item name="android:statusBarColor">#00000000</item>
                  <item name="android:navigationBarColor">#00000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">GreyPulse</string>
          </resources>
          EOF

          cat > app/src/main/java/com/grey/pulse/Audio.kt << 'KOTLIN_EOF'
          package com.grey.pulse

          import android.content.SharedPreferences
          import androidx.annotation.OptIn
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import androidx.media3.common.util.UnstableApi
          import java.nio.ByteBuffer
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.log10
          import kotlin.math.max
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.math.sqrt

          data class EqBand(val freq: Int, val gain: Int)

          /** All visualizer settings (menu > Visualizer). Defaults are what you asked for. */
          object Cfg {
              @Volatile var bassLo = 16          // Hz, top flare
              @Volatile var bassHi = 60          // Hz, bottom flare
              @Volatile var bassSens = 1f
              @Volatile var midLo = 1000         // Hz, rocking motion range
              @Volatile var midHi = 4000
              @Volatile var midSens = 1f
              @Volatile var midMove = 1f         // how far the center moves
              @Volatile var beatSens = 1f
              @Volatile var popStrength = 1f     // how big the center gets on a beat
              @Volatile var scatter = 1f         // how far particles are kicked on a beat
              @Volatile var syncMs = 120         // visuals delay to match the speaker
              @Volatile var pSize = 1f
              @Volatile var pCount = 160
              @Volatile var pRumble = 1f
              @Volatile var rangeVersion = 0     // bump when a Hz range changes (processor retunes)

              fun reset() {
                  bassLo = 16; bassHi = 60; bassSens = 1f
                  midLo = 1000; midHi = 4000; midSens = 1f; midMove = 1f
                  beatSens = 1f; popStrength = 1f; scatter = 1f; syncMs = 120
                  pSize = 1f; pCount = 160; pRumble = 1f
              }

              fun load(p: SharedPreferences) {
                  bassLo = p.getInt("c_bassLo", 16)
                  bassHi = p.getInt("c_bassHi", 60)
                  bassSens = p.getFloat("c_bassSens", 1f)
                  midLo = p.getInt("c_midLo", 1000)
                  midHi = p.getInt("c_midHi", 4000)
                  midSens = p.getFloat("c_midSens", 1f)
                  midMove = p.getFloat("c_midMove", 1f)
                  beatSens = p.getFloat("c_beatSens", 1f)
                  popStrength = p.getFloat("c_pop", 1f)
                  scatter = p.getFloat("c_scatter", 1f)
                  syncMs = p.getInt("c_sync", 120)
                  pSize = p.getFloat("c_pSize", 1f)
                  pCount = p.getInt("c_pCount", 160)
                  pRumble = p.getFloat("c_pRumble", 1f)
                  if (bassHi < bassLo + 5) bassHi = bassLo + 5
                  if (midHi < midLo + 200) midHi = midLo + 200
                  rangeVersion++
              }

              fun save(p: SharedPreferences) {
                  p.edit()
                      .putInt("c_bassLo", bassLo).putInt("c_bassHi", bassHi).putFloat("c_bassSens", bassSens)
                      .putInt("c_midLo", midLo).putInt("c_midHi", midHi).putFloat("c_midSens", midSens)
                      .putFloat("c_midMove", midMove).putFloat("c_beatSens", beatSens)
                      .putFloat("c_pop", popStrength).putFloat("c_scatter", scatter).putInt("c_sync", syncMs)
                      .putFloat("c_pSize", pSize).putInt("c_pCount", pCount).putFloat("c_pRumble", pRumble)
                      .apply()
              }
          }

          /**
           * Shared in-process bridge between the audio thread (BusProcessor) and the UI.
           *  levels[] : 12 bass bands from Cfg.bassLo to Cfg.bassHi Hz, each 0..1 (top flare -> bottom flare)
           *  mid      : average level of the mid range (Cfg.midLo..midHi), drives the rocking motion
           *  beat queue: detected beats (wall-clock nanoTime, strength, kind 0=beat 1=bar 2=8-bar phrase)
           */
          object AudioBus {
              const val BANDS = 12
              const val QN = 16

              @JvmField val levels = FloatArray(BANDS)
              @Volatile var mid = 0f
              @Volatile var lastUpdateNs = 0L

              @Volatile var bpm = 0f
              @Volatile var bpmNs = 0L

              @JvmField val beatNs = LongArray(QN)
              @JvmField val beatStr = FloatArray(QN)
              @JvmField val beatKind = IntArray(QN)
              @Volatile var beatHead = 0

              fun pushBeat(ns: Long, str: Float, kind: Int) {
                  val h = beatHead
                  val i = h % QN
                  beatNs[i] = ns
                  beatStr[i] = str
                  beatKind[i] = kind
                  beatHead = h + 1
              }

              @Volatile var eqOn = false
              @Volatile var eqBands: List<EqBand> = emptyList()
              @Volatile var eqVersion = 0

              fun setEq(on: Boolean, bands: List<EqBand>) {
                  eqOn = on
                  eqBands = bands
                  eqVersion++
              }
          }

          /**
           * Sits in ExoPlayer's audio chain (16-bit PCM only):
           *  1) user EQ: one peaking biquad per band (gain -50..0 dB)
           *  2) bass analysis (Goertzel, Cfg.bassLo..bassHi) -> AudioBus.levels
           *  3) mid analysis (Goertzel, Cfg.midLo..midHi)    -> AudioBus.mid
           *  4) beat detection on the low band + tempo / bar tracking -> AudioBus beat queue
           * Analysis runs AFTER the EQ, so the visuals follow what you actually hear.
           */
          @OptIn(UnstableApi::class)
          class BusProcessor : BaseAudioProcessor() {

              companion object {
                  private const val N = 256          // bass Goertzel window (decimated samples)
                  private const val HOP = 32
                  private const val EQ_Q = 1.0
                  private const val N2 = 512         // mid Goertzel window (raw samples)
                  private const val HOP2 = 256
                  private const val MID_BANDS = 6
                  private const val BLK = 16         // beat energy block (decimated samples)
                  private const val BH = 48          // beat energy history (blocks, ~0.55 s)
                  private const val BT = 12          // beat times kept for tempo
                  private val WIN = FloatArray(N) { (0.5 - 0.5 * cos(2.0 * PI * it / (N - 1))).toFloat() }
                  private val WIN2 = FloatArray(N2) { (0.5 - 0.5 * cos(2.0 * PI * it / (N2 - 1))).toFloat() }
              }

              private var sr = 44100
              private var ch = 2
              private var chunkNs = 0L
              private var curFrame = 0
              private var framesTotal = 0L

              // EQ state (audio thread only)
              private var eqVersionApplied = -1
              private var eqWasOn = false
              private var nBands = 0
              private var coef = DoubleArray(0)
              private var st = DoubleArray(0)

              // retune
              private var rangeApplied = -1
              private var dec = 32
              private var lpA = 0.0
              private val gk = DoubleArray(AudioBus.BANDS)
              private val midK = DoubleArray(MID_BANDS)

              // bass analysis
              private var decCount = 0
              private var lp1 = 0.0
              private var lp2 = 0.0
              private val ring = FloatArray(N)
              private var ringPos = 0
              private var hopCount = 0

              // mid analysis
              private val ring2 = FloatArray(N2)
              private var ring2Pos = 0
              private var hop2Count = 0

              // beat detection
              private var blkAcc = 0.0
              private var blkN = 0
              private val eHist = DoubleArray(BH)
              private var ehPos = 0
              private var ehFill = 0
              private var ehSum = 0.0
              private var ePrev = 0.0
              private var sinceBeat = 10.0
              private var lastBeatT = -10.0
              private val bt = DoubleArray(BT)
              private var btN = 0
              private var period = 0.0
              private var beatIdx = 0
              private var barIdx = 0
              private var downPhase = 0
              private val phaseAcc = FloatArray(4)

              override fun onConfigure(inputAudioFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputAudioFormat.encoding != C.ENCODING_PCM_16BIT ||
                      inputAudioFormat.channelCount < 1 || inputAudioFormat.channelCount > 8
                  ) {
                      return AudioProcessor.AudioFormat.NOT_SET // inactive, audio still plays
                  }
                  sr = inputAudioFormat.sampleRate
                  ch = inputAudioFormat.channelCount
                  dec = 0
                  retune()
                  lp1 = 0.0; lp2 = 0.0
                  eqVersionApplied = -1
                  nBands = 0
                  st = DoubleArray(0)
                  resetBeat()
                  return inputAudioFormat
              }

              private fun resetAnalysis() {
                  decCount = 0; hopCount = 0; ringPos = 0
                  java.util.Arrays.fill(ring, 0f)
                  blkAcc = 0.0; blkN = 0
                  java.util.Arrays.fill(eHist, 0.0)
                  ehPos = 0; ehFill = 0; ehSum = 0.0; ePrev = 0.0
              }

              private fun resetBeat() {
                  resetAnalysis()
                  java.util.Arrays.fill(ring2, 0f)
                  ring2Pos = 0; hop2Count = 0
                  sinceBeat = 10.0; lastBeatT = -10.0
                  btN = 0; period = 0.0
                  beatIdx = 0; barIdx = 0; downPhase = 0
                  java.util.Arrays.fill(phaseAcc, 0f)
              }

              /** Recompute the Goertzel frequency tables from the current settings. */
              private fun retune() {
                  val lo = Cfg.bassLo.toDouble().coerceAtLeast(5.0)
                  val hi = Cfg.bassHi.toDouble().coerceAtLeast(lo + 5.0)
                  val target = max(1400.0, hi * 6.0)
                  val newDec = max(1, (sr / target).toInt())
                  val fsD = sr.toDouble() / newDec
                  for (i in 0 until AudioBus.BANDS) {
                      val f = lo + i * (hi - lo) / (AudioBus.BANDS - 1.0)
                      gk[i] = 2.0 * cos(2.0 * PI * f / fsD)
                  }
                  lpA = 1.0 - exp(-2.0 * PI * max(200.0, hi * 1.6) / sr)
                  if (newDec != dec) {
                      dec = newDec
                      resetAnalysis()
                  }
                  val mlo = Cfg.midLo.toDouble().coerceAtLeast(100.0)
                  val mhi = Cfg.midHi.toDouble().coerceAtLeast(mlo * 1.2).coerceAtMost(sr * 0.45)
                  for (i in 0 until MID_BANDS) {
                      val f = mlo * (mhi / mlo).coerceAtLeast(1.01).pow(i / (MID_BANDS - 1.0))
                      midK[i] = 2.0 * cos(2.0 * PI * f / sr)
                  }
                  rangeApplied = Cfg.rangeVersion
              }

              override fun queueInput(inputBuffer: ByteBuffer) {
                  val n = inputBuffer.remaining()
                  if (n == 0) return
                  val out = replaceOutputBuffer(n)
                  if (rangeApplied != Cfg.rangeVersion) retune()
                  syncEq()
                  chunkNs = System.nanoTime()
                  val on = AudioBus.eqOn && nBands > 0
                  if (on && !eqWasOn) java.util.Arrays.fill(st, 0.0)
                  eqWasOn = on
                  val frames = n / (2 * ch)
                  for (f in 0 until frames) {
                      curFrame = f
                      framesTotal++
                      var mono = 0.0
                      for (c in 0 until ch) {
                          var x = inputBuffer.getShort().toDouble() / 32768.0
                          if (on) {
                              for (b in 0 until nBands) {
                                  val ci = b * 5
                                  val si = (b * ch + c) * 4
                                  val y = coef[ci] * x + coef[ci + 1] * st[si] + coef[ci + 2] * st[si + 1] -
                                      coef[ci + 3] * st[si + 2] - coef[ci + 4] * st[si + 3]
                                  st[si + 1] = st[si]; st[si] = x
                                  st[si + 3] = st[si + 2]; st[si + 2] = y
                                  x = y
                              }
                          }
                          val v = Math.round(x * 32768.0).coerceIn(-32768L, 32767L).toInt()
                          out.putShort(v.toShort())
                          mono += x
                      }
                      analyze(mono / ch)
                  }
                  while (inputBuffer.hasRemaining()) out.put(inputBuffer.get())
                  out.flip()
              }

              private fun syncEq() {
                  val v = AudioBus.eqVersion
                  if (v == eqVersionApplied) return
                  eqVersionApplied = v
                  val bands = AudioBus.eqBands
                  val newN = bands.size
                  if (newN != nBands || st.size != newN * ch * 4) st = DoubleArray(newN * ch * 4)
                  nBands = newN
                  coef = DoubleArray(newN * 5)
                  for (i in bands.indices) {
                      val b = bands[i]
                      val ci = i * 5
                      if (b.gain >= 0 || b.freq >= sr * 0.45) {
                          coef[ci] = 1.0
                          continue
                      }
                      val a = 10.0.pow(b.gain / 40.0)
                      val w0 = 2.0 * PI * b.freq / sr
                      val alpha = sin(w0) / (2.0 * EQ_Q)
                      val cw = cos(w0)
                      val a0 = 1.0 + alpha / a
                      coef[ci] = (1.0 + alpha * a) / a0
                      coef[ci + 1] = (-2.0 * cw) / a0
                      coef[ci + 2] = (1.0 - alpha * a) / a0
                      coef[ci + 3] = (-2.0 * cw) / a0
                      coef[ci + 4] = (1.0 - alpha / a) / a0
                  }
              }

              private fun analyze(x: Double) {
                  // ---- mid (raw samples)
                  ring2[ring2Pos] = x.toFloat()
                  ring2Pos = (ring2Pos + 1) % N2
                  hop2Count++
                  if (hop2Count >= HOP2) {
                      hop2Count = 0
                      computeMid()
                  }

                  // ---- bass (low-pass + decimate)
                  lp1 += lpA * (x - lp1)
                  lp2 += lpA * (lp1 - lp2)
                  decCount++
                  if (decCount < dec) return
                  decCount = 0

                  // beat energy blocks
                  blkAcc += lp2 * lp2
                  blkN++
                  if (blkN >= BLK) {
                      val e = blkAcc / BLK
                      blkAcc = 0.0
                      blkN = 0
                      onBlock(e)
                  }

                  ring[ringPos] = lp2.toFloat()
                  ringPos = (ringPos + 1) % N
                  hopCount++
                  if (hopCount < HOP) return
                  hopCount = 0
                  computeBass()
              }

              private fun computeBass() {
                  val lv = AudioBus.levels
                  for (i in 0 until AudioBus.BANDS) {
                      val k = gk[i]
                      var s1 = 0.0
                      var s2 = 0.0
                      var p = ringPos
                      for (j in 0 until N) {
                          val s0 = ring[p].toDouble() * WIN[j].toDouble() + k * s1 - s2
                          s2 = s1
                          s1 = s0
                          p++
                          if (p == N) p = 0
                      }
                      val power = s1 * s1 + s2 * s2 - k * s1 * s2
                      val amp = sqrt(max(power, 0.0)) / (N / 4.0)
                      val db = 20.0 * log10(amp + 1e-9)
                      lv[i] = ((db + 60.0) / 57.0).coerceIn(0.0, 1.0).toFloat()
                  }
                  AudioBus.lastUpdateNs = System.nanoTime()
              }

              private fun computeMid() {
                  var sum = 0.0
                  for (i in 0 until MID_BANDS) {
                      val k = midK[i]
                      var s1 = 0.0
                      var s2 = 0.0
                      var p = ring2Pos
                      for (j in 0 until N2) {
                          val s0 = ring2[p].toDouble() * WIN2[j].toDouble() + k * s1 - s2
                          s2 = s1
                          s1 = s0
                          p++
                          if (p == N2) p = 0
                      }
                      val power = s1 * s1 + s2 * s2 - k * s1 * s2
                      val amp = sqrt(max(power, 0.0)) / (N2 / 4.0)
                      val db = 20.0 * log10(amp + 1e-9)
                      sum += ((db + 70.0) / 50.0).coerceIn(0.0, 1.0)
                  }
                  AudioBus.mid = (sum / MID_BANDS).toFloat()
              }

              // ------------------------------------------------------------ beats
              private fun onBlock(e: Double) {
                  val dtB = BLK.toDouble() * dec / sr
                  sinceBeat += dtB
                  val avg = if (ehFill > 0) ehSum / ehFill else 0.0
                  ehSum -= eHist[ehPos]
                  eHist[ehPos] = e
                  ehSum += e
                  ehPos = (ehPos + 1) % BH
                  if (ehFill < BH) ehFill++

                  val thr = 1.25 + 0.5 / Cfg.beatSens.toDouble().coerceAtLeast(0.1)
                  val minGap = if (period > 0.0) max(0.22, period * 0.55) else 0.25
                  if (ehFill >= BH / 2 && avg > 0.0 && e > avg * thr && e > 1e-4 &&
                      sinceBeat > minGap && e >= ePrev
                  ) {
                      fireBeat(e / avg, thr)
                  }
                  ePrev = e
              }

              private fun fireBeat(ratio: Double, thr: Double) {
                  val t = framesTotal / sr.toDouble()
                  if (t - lastBeatT > 2.0) {
                      // silence or a new section: restart bar counting
                      beatIdx = 0; barIdx = 0; downPhase = 0; btN = 0
                      java.util.Arrays.fill(phaseAcc, 0f)
                  }
                  if (btN < BT) {
                      bt[btN++] = t
                  } else {
                      System.arraycopy(bt, 1, bt, 0, BT - 1)
                      bt[BT - 1] = t
                  }
                  lastBeatT = t
                  sinceBeat = 0.0
                  updateTempo()

                  val str = (((ratio - thr) / 2.0).coerceIn(0.0, 1.0) * 0.7 + 0.3).toFloat()

                  // bar position: the beat position (0..3) that keeps getting the loudest hits is "1"
                  val ph = beatIdx % 4
                  phaseAcc[ph] = phaseAcc[ph] * 0.8f + ratio.toFloat() * 0.2f
                  var best = downPhase
                  for (p in 0 until 4) {
                      if (phaseAcc[p] > phaseAcc[best] * 1.15f) best = p
                  }
                  downPhase = best
                  var kind = 0
                  if (ph == downPhase) {
                      barIdx++
                      kind = if (barIdx % 8 == 0) 2 else 1
                  }
                  beatIdx++

                  val ns = chunkNs + curFrame * 1_000_000_000L / sr
                  AudioBus.pushBeat(ns, str, kind)
              }

              private fun updateTempo() {
                  if (btN < 4) return
                  val ibis = DoubleArray(btN - 1)
                  for (i in 1 until btN) {
                      var v = bt[i] - bt[i - 1]
                      while (v < 0.37) v *= 2.0
                      while (v >= 0.74) v /= 2.0
