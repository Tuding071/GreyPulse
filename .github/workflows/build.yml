          @Composable
          fun EqBars(animate: Boolean) {
              val tr = rememberInfiniteTransition(label = "eq")
              val a0 by tr.animateFloat(0.4f, 1f, infiniteRepeatable(tween(600, easing = LinearEasing), RepeatMode.Reverse), label = "a0")
              val a1 by tr.animateFloat(0.4f, 1f, infiniteRepeatable(tween(780, easing = LinearEasing), RepeatMode.Reverse), label = "a1")
              val a2 by tr.animateFloat(0.4f, 1f, infiniteRepeatable(tween(900, easing = LinearEasing), RepeatMode.Reverse), label = "a2")
              Canvas(Modifier.size(width = 16.dp, height = 14.dp)) {
                  val bw = 3.dp.toPx()
                  val gap = 2.dp.toPx()
                  val hs = if (animate) floatArrayOf(0.4f * a0, 0.9f * a1, 0.6f * a2) else floatArrayOf(0.4f, 0.9f, 0.6f)
                  for (i in 0..2) {
                      val bh = size.height * hs[i]
                      drawRoundRect(
                          Color.White,
                          topLeft = Offset(i * (bw + gap), size.height - bh),
                          size = Size(bw, bh),
                          cornerRadius = androidx.compose.ui.geometry.CornerRadius(2.dp.toPx())
                      )
                  }
              }
          }

          // ---------------------------------------------------------------- root
          @Composable
          fun PulseApp() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val vm = remember { PlayerVm(ctx.applicationContext, scope) }
              var panel by remember { mutableStateOf(Panel.None) }
              var pendingDelete by remember { mutableStateOf<Int?>(null) }
              val manualScan = remember { booleanArrayOf(false) }

              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  vm.scan(manualScan[0])
                  manualScan[0] = false
              }

              fun requestAndScan(manual: Boolean) {
                  manualScan[0] = manual
                  val perms = if (Build.VERSION.SDK_INT >= 33)
                      arrayOf(Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.POST_NOTIFICATIONS)
                  else arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  val need = perms.filter { ContextCompat.checkSelfPermission(ctx, it) != PackageManager.PERMISSION_GRANTED }
                  if (need.isEmpty()) {
                      vm.scan(manual)
                      manualScan[0] = false
                  } else {
                      permLauncher.launch(need.toTypedArray())
                  }
              }

              LaunchedEffect(Unit) { requestAndScan(false) }

              DisposableEffect(Unit) {
                  val token = SessionToken(ctx, ComponentName(ctx, PlaybackService::class.java))
                  val future = MediaController.Builder(ctx, token).buildAsync()
                  future.addListener({
                      try {
                          vm.attach(future.get())
                      } catch (e: Exception) {
                      }
                  }, ContextCompat.getMainExecutor(ctx))
                  onDispose {
                      vm.detach()
                      MediaController.releaseFuture(future)
                  }
              }

              LaunchedEffect(Unit) {
                  while (true) {
                      vm.pollPos()
                      delay(250)
                  }
              }

              BackHandler(enabled = panel != Panel.None) { panel = Panel.None }

              Box(
                  Modifier
                      .fillMaxSize()
                      .background(Brush.verticalGradient(listOf(Color(0xFF18181B), Color(0xFF0E0E10))))
              ) {
                  AndroidView(
                      factory = { VisualizerView(it) },
                      update = { it.playing = vm.isPlaying },
                      modifier = Modifier.fillMaxSize()
                  )

                  Column(Modifier.fillMaxSize()) {
                      TopBar(
                          vm = vm,
                          panel = panel,
                          onLeft = { panel = if (panel == Panel.None) Panel.List else Panel.None },
                          onRight = { panel = Panel.Menu }
                      )
                      Box(Modifier.weight(1f).fillMaxWidth()) {
                          Overlay(panel == Panel.List) {
                              ListPanel(vm) { panel = Panel.None }
                          }
                          Overlay(panel == Panel.Menu) {
                              MenuPanel(
                                  onEq = { panel = Panel.Eq },
                                  onScan = { panel = Panel.None; requestAndScan(true) }
                              )
                          }
                          Overlay(panel == Panel.Eq) {
                              EqPanel(vm) { idx -> pendingDelete = idx }
                          }
                      }
                      Controls(vm)
                  }

                  val pd = pendingDelete
                  if (pd != null && pd in vm.eqBands.indices) {
                      val band = vm.eqBands[pd]
                      ConfirmDelete(
                          freq = band.freq,
                          onCancel = { pendingDelete = null },
                          onDelete = {
                              vm.eqBands = vm.eqBands.filterIndexed { i, _ -> i != pd }
                              vm.pushEq()
                              pendingDelete = null
                          }
                      )
                  }
              }
          }

          // ---------------------------------------------------------------- top bar
          @Composable
          fun TopBar(vm: PlayerVm, panel: Panel, onLeft: () -> Unit, onRight: () -> Unit) {
              val dotColor = if (!vm.hasQueue) CHeart else if (vm.isPlaying) CGreen else CAmber
              val label = if (!vm.hasQueue) "Ready" else if (vm.isPlaying) "Playing" else "Paused"
              Row(
                  Modifier.fillMaxWidth().statusBarsPadding().height(72.dp).padding(horizontal = 18.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(Modifier.size(44.dp).tap(onLeft), contentAlignment = Alignment.Center) {
                      if (panel == Panel.None) IconListBtn() else IconBack()
                  }
                  Row(Modifier.weight(1f), Arrangement.Center, Alignment.CenterVertically) {
                      Box(Modifier.size(8.dp).clip(CircleShape).background(dotColor))
                      Box(Modifier.width(8.dp))
                      Text(
                          label.uppercase(), color = CDim, fontSize = 12.sp,
                          fontWeight = FontWeight.SemiBold, letterSpacing = 1.4.sp
                      )
                  }
                  Box(Modifier.size(44.dp), contentAlignment = Alignment.Center) {
                      if (panel == Panel.None) {
                          Box(Modifier.size(44.dp).tap(onRight), contentAlignment = Alignment.Center) { IconDots() }
                      }
                  }
              }
          }

          @Composable
          fun Overlay(visible: Boolean, content: @Composable () -> Unit) {
              AnimatedVisibility(visible, enter = fadeIn(tween(300)), exit = fadeOut(tween(300))) {
                  Column(
                      Modifier
                          .fillMaxSize()
                          .background(
                              Brush.verticalGradient(
                                  listOf(Color(0xE60A0A0C), Color(0xCC0A0A0C), Color(0x990A0A0C))
                              )
                          )
                          .padding(horizontal = 18.dp)
                          .pointerInput(Unit) { detectTapGestures { } }
                  ) {
                      content()
                  }
              }
          }

          // ---------------------------------------------------------------- list
          @Composable
          fun ListPanel(vm: PlayerVm, onPicked: () -> Unit) {
              if (vm.tracks.isEmpty()) {
                  Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      Text(
                          "No songs yet.\nOpen the menu and tap Scan Files.",
                          color = CDim, fontSize = 13.sp, textAlign = TextAlign.Center, lineHeight = 20.sp
                      )
                  }
                  return
              }
              LazyColumn(Modifier.fillMaxSize()) {
                  itemsIndexed(vm.tracks, key = { _, t -> t.id }) { i, t ->
                      val cur = t.id.toString() == vm.nowId
                      Row(
                          Modifier
                              .fillMaxWidth()
                              .padding(vertical = 2.dp)
                              .clip(RoundedCornerShape(14.dp))
                              .background(if (cur) Color(0x10FFFFFF) else Color.Transparent)
                              .tap { vm.playIndex(i); onPicked() }
                              .padding(10.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(
                              Modifier.size(44.dp).clip(RoundedCornerShape(10.dp)).background(CSurf2),
                              contentAlignment = Alignment.Center
                          ) {
                              if (cur) EqBars(vm.isPlaying) else IconNote()
                          }
                          Column(Modifier.weight(1f).padding(horizontal = 12.dp)) {
                              Text(
                                  t.title, color = if (cur) Color.White else CText, fontSize = 14.sp,
                                  fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis
                              )
                              Text(t.artist, color = CDim, fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                          Text(fmtMs(t.durMs), color = CDim, fontSize = 11.sp)
                      }
                  }
              }
          }

          // ---------------------------------------------------------------- menu
          @Composable
          fun MenuPanel(onEq: () -> Unit, onScan: () -> Unit) {
              Column(Modifier.fillMaxWidth().padding(vertical = 8.dp)) {
                  MenuRow("Equalizer", "Add bands and shape the sound", onEq) { IconEq() }
                  MenuRow("Scan Files", "Find songs on this device", onScan) { IconScan() }
              }
          }

          @Composable
          fun MenuRow(title: String, sub: String, onClick: () -> Unit, icon: @Composable () -> Unit) {
              Row(
                  Modifier.fillMaxWidth().clip(RoundedCornerShape(14.dp)).tap(onClick).padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier.size(40.dp).clip(RoundedCornerShape(12.dp)).background(CSurf2),
                      contentAlignment = Alignment.Center
                  ) { icon() }
                  Column(Modifier.padding(start = 14.dp)) {
                      Text(title, color = CText, fontSize = 15.sp, fontWeight = FontWeight.SemiBold)
                      Text(sub, color = CDim, fontSize = 11.sp)
                  }
              }
          }

          // ---------------------------------------------------------------- equalizer
          @Composable
          fun Toggle(on: Boolean, onChange: (Boolean) -> Unit) {
              val bg by animateColorAsState(if (on) CGreen else CSurf3, label = "tg")
              val x by animateDpAsState(if (on) 25.dp else 3.dp, label = "tk")
              Box(
                  Modifier
                      .size(52.dp, 30.dp)
                      .clip(RoundedCornerShape(99.dp))
                      .background(bg)
                      .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) { onChange(!on) }
              ) {
                  Box(Modifier.offset(x, 3.dp).size(24.dp).clip(CircleShape).background(Color.White))
              }
          }

          @Composable
          fun EqPanel(vm: PlayerVm, askDelete: (Int) -> Unit) {
              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier.fillMaxWidth().padding(start = 4.dp, end = 4.dp, top = 6.dp, bottom = 14.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(Modifier.weight(1f)) {
                          Text("Equalizer", color = CText, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          Text("BANDS", color = CDim, fontSize = 11.sp, letterSpacing = 0.6.sp)
                      }
                      Toggle(vm.eqOn) { vm.eqOn = it; vm.pushEq() }
                  }

                  AddForm(vm)

                  Row(
                      Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 6.dp),
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      for (s in listOf("-50", "-40", "-30", "-20", "-10", "0 dB")) {
                          Text(s, color = CDim, fontSize = 10.sp)
                      }
                  }
                  Box(Modifier.fillMaxWidth().height(1.dp).background(Color(0x12FFFFFF)))

                  Box(Modifier.weight(1f).fillMaxWidth().alpha(if (vm.eqOn) 1f else 0.35f)) {
                      if (vm.eqBands.isEmpty()) {
                          Text(
                              "No bands yet.\nType a frequency above and tap Add.",
                              color = CDim, fontSize = 12.sp, textAlign = TextAlign.Center, lineHeight = 18.sp,
                              modifier = Modifier.fillMaxWidth().padding(22.dp)
                          )
                      } else {
                          LazyColumn(Modifier.fillMaxSize()) {
                              itemsIndexed(vm.eqBands, key = { _, b -> b.freq }) { i, b ->
                                  BandRow(
                                      b = b,
                                      enabled = vm.eqOn,
                                      onGain = { g ->
                                          vm.eqBands = vm.eqBands.map { if (it.freq == b.freq) it.copy(gain = g) else it }
                                          vm.pushEq()
                                      },
                                      onDelete = { askDelete(i) }
                                  )
                              }
                          }
                      }
                  }
                  Text(
                      "ENTER A FREQUENCY ABOVE, THEN TAP ADD",
                      color = Color(0x55FFFFFF), fontSize = 10.sp, letterSpacing = 0.6.sp,
                      textAlign = TextAlign.Center,
                      modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp)
                  )
              }
          }

          @Composable
          fun AddForm(vm: PlayerVm) {
              var text by remember { mutableStateOf("") }
              val value = text.toIntOrNull()
              val valid = value != null && value in 1..20000

              fun add() {
                  val f = text.toIntOrNull() ?: return
                  if (f !in 1..20000) return
                  if (vm.eqBands.none { it.freq == f }) {
                      vm.eqBands = (vm.eqBands + EqBand(f, 0)).sortedBy { it.freq }
                      vm.pushEq()
                  }
                  text = ""
              }

              Row(
                  Modifier.fillMaxWidth().padding(start = 4.dp, end = 4.dp, top = 10.dp, bottom = 12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Row(
                      Modifier
                          .weight(1f)
                          .height(40.dp)
                          .clip(RoundedCornerShape(12.dp))
                          .background(Color(0x10FFFFFF))
                          .border(1.dp, Color(0x1AFFFFFF), RoundedCornerShape(12.dp))
                          .padding(horizontal = 10.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      BasicTextField(
                          value = text,
                          onValueChange = { v -> text = v.filter { it.isDigit() }.take(5) },
                          singleLine = true,
                          textStyle = TextStyle(color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.SemiBold),
                          cursorBrush = SolidColor(Color.White),
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number, imeAction = ImeAction.Done),
                          keyboardActions = KeyboardActions(onDone = { add() }),
                          modifier = Modifier.weight(1f),
                          decorationBox = { inner ->
                              Box(contentAlignment = Alignment.CenterStart) {
                                  if (text.isEmpty()) Text("Frequency", color = Color(0x55FFFFFF), fontSize = 14.sp)
                                  inner()
                              }
                          }
                      )
                      Text("HZ", color = CDim, fontSize = 11.sp, letterSpacing = 0.6.sp)
                  }
                  Box(Modifier.width(8.dp))
                  Row(
                      Modifier
                          .height(40.dp)
                          .alpha(if (valid) 1f else 0.35f)
                          .clip(RoundedCornerShape(12.dp))
                          .background(Brush.linearGradient(listOf(Color(0xFFF7F7FA), Color(0xFFC9C9D2))))
                          .clickable(
                              interactionSource = remember { MutableInteractionSource() },
                              indication = null,
                              enabled = valid
                          ) { add() }
                          .padding(horizontal = 14.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      IconPlus()
                      Box(Modifier.width(6.dp))
                      Text("Add", color = Color(0xFF0E0E10), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                  }
              }
          }

          fun gainFor(x: Float, w: Float): Int = (-50f + (x / w).coerceIn(0f, 1f) * 50f).roundToInt()

          @Composable
          fun BandRow(b: EqBand, enabled: Boolean, onGain: (Int) -> Unit, onDelete: () -> Unit) {
              val cb by rememberUpdatedState(onGain)
              var wPx by remember { mutableStateOf(1f) }
              val pct = ((b.gain + 50) / 50f).coerceIn(0f, 1f)
              Row(
                  Modifier.fillMaxWidth().padding(horizontal = 10.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(
                      b.freq.toString() + " Hz", color = Color(0xCCFFFFFF), fontSize = 12.sp,
                      fontWeight = FontWeight.SemiBold, modifier = Modifier.width(56.dp)
                  )
                  Box(
                      Modifier
                          .weight(1f)
                          .height(32.dp)
                          .onSizeChanged { wPx = it.width.toFloat().coerceAtLeast(1f) }
                          .pointerInput(enabled) {
                              if (!enabled) return@pointerInput
                              detectTapGestures { o -> cb(gainFor(o.x, wPx)) }
                          }
                          .pointerInput(enabled) {
                              if (!enabled) return@pointerInput
                              detectHorizontalDragGestures(
                                  onDragStart = { o -> cb(gainFor(o.x, wPx)) },
                                  onHorizontalDrag = { ch, _ -> cb(gainFor(ch.position.x, wPx)) }
                              )
                          },
                      contentAlignment = Alignment.CenterStart
                  ) {
                      Box(Modifier.fillMaxWidth().height(4.dp).clip(RoundedCornerShape(99.dp)).background(CSurf3))
                      Box(
                          Modifier.fillMaxWidth(pct).height(4.dp).clip(RoundedCornerShape(99.dp))
                              .background(Color(0xCCFFFFFF))
                      )
                      Box(
                          Modifier
                              .offset { IntOffset((pct * wPx - 7.dp.toPx()).roundToInt(), 0) }
                              .size(14.dp)
                              .clip(CircleShape)
                              .background(Color.White)
                      )
                  }
                  Text(
                      b.gain.toString() + " dB", color = CDim, fontSize = 11.sp, textAlign = TextAlign.End,
                      modifier = Modifier.width(52.dp)
                  )
                  Box(
                      Modifier
                          .size(26.dp)
                          .clip(CircleShape)
                          .background(Color(0x10FFFFFF))
                          .tap(onDelete),
                      contentAlignment = Alignment.Center
                  ) {
                      Text("x", color = Color(0x88FFFFFF), fontSize = 14.sp)
                  }
              }
          }

          @Composable
          fun ConfirmDelete(freq: Int, onCancel: () -> Unit, onDelete: () -> Unit) {
              Box(
                  Modifier
                      .fillMaxSize()
                      .background(Color(0xAA000000))
                      .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) { onCancel() }
                      .padding(24.dp),
                  contentAlignment = Alignment.Center
              ) {
                  Column(
                      Modifier
                          .width(320.dp)
                          .clip(RoundedCornerShape(20.dp))
                          .background(Brush.verticalGradient(listOf(Color(0xFF2A2A30), Color(0xFF1E1E23))))
                          .border(1.dp, Color(0x14FFFFFF), RoundedCornerShape(20.dp))
                          .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) { }
                          .padding(start = 20.dp, end = 20.dp, top = 22.dp, bottom = 18.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Box(
                          Modifier.size(52.dp).clip(CircleShape).background(Color(0x22FF6B81)),
                          contentAlignment = Alignment.Center
                      ) { IconTrash() }
                      Box(Modifier.height(14.dp))
                      Text("Delete band?", color = CText, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                      Box(Modifier.height(6.dp))
                      Text(
                          "Remove the " + freq + " Hz band from your equalizer?",
                          color = CDim, fontSize = 13.sp, textAlign = TextAlign.Center, lineHeight = 19.sp
                      )
                      Box(Modifier.height(18.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          Box(
                              Modifier.weight(1f).height(44.dp).clip(RoundedCornerShape(12.dp))
                                  .background(Color(0x14FFFFFF)).tap(onCancel),
                              contentAlignment = Alignment.Center
                          ) { Text("Cancel", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold) }
                          Box(
                              Modifier.weight(1f).height(44.dp).clip(RoundedCornerShape(12.dp))
                                  .background(CHeart).tap(onDelete),
                              contentAlignment = Alignment.Center
                          ) { Text("Delete", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold) }
                      }
                  }
              }
          }

          // ---------------------------------------------------------------- bottom controls
          @Composable
          fun Controls(vm: PlayerVm) {
              Column(
                  Modifier
                      .fillMaxWidth()
                      .navigationBarsPadding()
                      .padding(start = 22.dp, end = 22.dp, bottom = 24.dp)
              ) {
                  Column(Modifier.fillMaxWidth().padding(bottom = 20.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(
                          vm.title, color = CText, fontSize = 20.sp, fontWeight = FontWeight.Bold,
                          maxLines = 1, overflow = TextOverflow.Ellipsis
                      )
                      Text(vm.artist, color = CDim, fontSize = 13.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                  }
                  SeekBar(vm)
                  Box(Modifier.height(22.dp))
                  Row(
                      Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(28.dp, Alignment.CenterHorizontally),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(Modifier.size(44.dp).tap { vm.prev() }, contentAlignment = Alignment.Center) { IconPrev() }
                      Box(
                          Modifier
                              .size(68.dp)
                              .clip(CircleShape)
                              .background(Brush.linearGradient(listOf(Color(0xFFF7F7FA), Color(0xFFC9C9D2))))
                              .tap { vm.togglePlay() },
                          contentAlignment = Alignment.Center
                      ) {
                          if (vm.isPlaying) IconPause(Color(0xFF0E0E10), 30.dp) else IconPlay(Color(0xFF0E0E10), 30.dp)
                      }
                      Box(Modifier.size(44.dp).tap { vm.next() }, contentAlignment = Alignment.Center) { IconNext() }
                  }
              }
          }

          @Composable
          fun SeekBar(vm: PlayerVm) {
              var drag by remember { mutableStateOf<Float?>(null) }
              var wPx by remember { mutableStateOf(1f) }
              val d = drag
              val frac = d ?: if (vm.durMs > 0) (vm.posMs.toFloat() / vm.durMs).coerceIn(0f, 1f) else 0f
              Column(Modifier.fillMaxWidth()) {
                  Box(
                      Modifier
                          .fillMaxWidth()
                          .height(28.dp)
                          .onSizeChanged { wPx = it.width.toFloat().coerceAtLeast(1f) }
                          .pointerInput(Unit) {
                              detectTapGestures { o -> vm.seekFrac((o.x / wPx).coerceIn(0f, 1f)) }
                          }
                          .pointerInput(Unit) {
                              detectHorizontalDragGestures(
                                  onDragStart = { o -> drag = (o.x / wPx).coerceIn(0f, 1f) },
                                  onDragEnd = {
                                      val v = drag
                                      if (v != null) vm.seekFrac(v)
                                      drag = null
                                  },
                                  onDragCancel = { drag = null },
                                  onHorizontalDrag = { ch, _ -> drag = (ch.position.x / wPx).coerceIn(0f, 1f) }
                              )
                          },
                      contentAlignment = Alignment.CenterStart
                  ) {
                      Box(Modifier.fillMaxWidth().height(6.dp).clip(RoundedCornerShape(99.dp)).background(CSurf3))
                      Box(
                          Modifier.fillMaxWidth(frac).height(6.dp).clip(RoundedCornerShape(99.dp))
                              .background(Brush.horizontalGradient(listOf(Color(0xFFF5F5F7), Color(0xFFB8B8C2))))
                      )
                      Box(
                          Modifier
                              .offset { IntOffset((frac * wPx - 7.dp.toPx()).roundToInt(), 0) }
                              .size(14.dp)
                              .clip(CircleShape)
                              .background(Color.White)
                      )
                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Text(fmtMs((frac * vm.durMs).toLong()), color = CDim, fontSize = 11.sp)
                      Text(fmtMs(vm.durMs), color = CDim, fontSize = 11.sp)
                  }
              }
          }
          KOTLIN_EOF

      - name: Generate dummy keystore
        run: |
          keytool -genkeypair -v -keystore app/dummy.keystore -alias dummy \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=GreyPulse, OU=Dev, O=Grey, L=NA, S=NA, C=US"

      - name: Generate launcher icons
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow
          python3 - << 'PY'
          from PIL import Image, ImageDraw
          import os

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}

          def make(sz, rnd):
              S = sz * 4
              im = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              bg = (24, 24, 27, 255)
              if rnd:
                  d.ellipse((0, 0, S - 1, S - 1), fill=bg)
              else:
                  d.rounded_rectangle((0, 0, S - 1, S - 1), radius=int(S * 0.22), fill=bg)
              c = S / 2
              for r, col in ((0.40, (235, 235, 240, 255)), (0.32, (0, 0, 0, 255)),
                             (0.24, (235, 235, 240, 255)), (0.15, (0, 0, 0, 255))):
                  d.ellipse((c - r * S, c - r * S, c + r * S, c + r * S), fill=col)
              return im.resize((sz, sz), Image.LANCZOS)

          for name, sz in sizes.items():
              folder = "app/src/main/res/mipmap-" + name
              os.makedirs(folder, exist_ok=True)
              make(sz, False).save(folder + "/ic_launcher.png")
              make(sz, True).save(folder + "/ic_launcher_round.png")
          PY

      - name: Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1 --no-daemon

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          ls -la app/build/outputs/apk/release/
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$APK"

      - name: Bundle output
        run: |
          mkdir -p bundle
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk bundle/GreyPulse.apk
          cp -r app/src bundle/source
          cp .github/workflows/build.yml bundle/build.yml
          {
            echo "App: GreyPulse (com.grey.pulse)"
            echo "Build number: ${BUILD_NUMBER}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > bundle/BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreyPulse-${{ github.run_number }}
          path: bundle
          retention-days: 30
