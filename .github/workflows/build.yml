                                          for (k in BASS_LO..BASS_HI) a += out.get(b0 + k)
                                      }
                                      bassE[j] = a * 0.5f
                                  }
                              }
                          } finally {
                              tensor.close()
                          }
                          progress(0.08f + 0.9f * (s + 1) / splits)
                      }
                      val map = BeatTracker.build(kick, bassE, frames)
                      progress(1f)
                      return map
                  } catch (t: Throwable) {
                      lastError = (t.message ?: t.javaClass.simpleName).take(120)
                      return null
                  } finally {
                      Process.setThreadPriority(Process.THREAD_PRIORITY_DEFAULT)
                  }
              }
