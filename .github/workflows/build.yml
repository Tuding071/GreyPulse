          @Composable
          fun EqBars(animate: Boolean) {
              val tr = rememberInfiniteTransition(label = "eq")
              val a0 by tr.animateFloat(0.4f, 1f, infiniteRepeatable(tween(600, easing = LinearEasing), RepeatMode.Reverse), label = "a0")
              val a1 by tr.animateFloat(0.4f, 1f, infiniteRepeatable(tween(780, easing = LinearEasing), RepeatMode.Reverse), label = "a1")
              val a2 by tr.animateFloat(0.4f, 1f, infiniteRepeatable(tween(900, easing = LinearEasing), RepeatMode.Reverse), label = "a2")
              Canvas(Modifier.size(width = 16.dp, height = 14.dp)) {
